name: SDK drift check

# Weekly: download Axeptio's sdk.js and tcf/sdk.js, re-extract the settings class field list
# (with defaults), the TCF destructuring and a few behaviour anchors, and compare them with
# sdk-snapshot.json. Opens (or updates) an issue labelled sdk-drift when something moved, or when
# the check itself can't run (CDN unreachable, minified shape changed).
on:
  schedule:
    - cron: '41 9 * * 1' # Mondays, 09:41 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write # keep the schedule alive (see the last step)

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Compare both SDKs with the snapshot
        id: drift
        run: node scripts/sdk-drift.mjs --compare sdk-snapshot.json --out drift
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-drift
          path: drift/
          if-no-files-found: ignore
      - name: Open or update the drift issue
        # failure() also catches a broken setup (checkout) before the check could run.
        if: always() && (failure() || steps.drift.outputs.changed == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # gh works even if checkout failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p drift
          {
            if [ -f drift/report.md ]; then
              cat drift/report.md
            else
              echo "## Snippet Generator: Axeptio SDK drift check"
              echo
              echo "The check failed before writing a report: see the run logs."
            fi
            echo
            echo "Run: $RUN_URL"
          } > drift/issue.md
          gh label create sdk-drift --color FBCA04 --description "Axeptio's SDK changed" --force
          existing=$(gh issue list --label sdk-drift --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file drift/issue.md
          else
            gh issue create --title "Axeptio's SDK changed: check the Snippet Generator" --label sdk-drift --body-file drift/issue.md
          fi
      # GitHub disables scheduled workflows after 60 days without repository activity.
      # Re-enabling this one each week resets that clock.
      - name: Keep the weekly schedule alive
        if: always() && github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sdk-drift.yml/enable"
