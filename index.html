:root {
  color-scheme: light;
  --font-body: 'Source Sans 3', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-heading: 'Figtree', 'Source Sans 3', system-ui, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace;

  --page: #f8f8f7;
  --surface-1: #ffffff;
  --surface-2: #f3f3f1;
  --surface-3: #ebebe8;
  --border: #e5e4e1;
  --border-strong: #cfcec9;
  --text-primary: #262625;
  --text-secondary: #55544f;
  --text-muted: #6f6e6a;
  --accent: #f5d141;
  --accent-hover: #ecc42a;
  --accent-ink: #262625;
  --focus: #119b9b;
  --link: #1c5cab;
  --shadow: 0 1px 2px rgba(38, 38, 37, 0.06), 0 8px 24px rgba(38, 38, 37, 0.08);

  /* Status (fixed, always with an icon and a label) */
  --status-critical: #d03b3b;
  --status-warning: #fab219;
  --status-serious: #ec835a;
  --status-good: #0ca30c;
  --status-good-text: #006300;

  /* Code (hand-made highlighting, contrast checked on --code-bg) */
  --code-bg: #f3f3f1;
  --code-text: #262625;
  --code-comment: #6f6e6a;
  --code-string: #0a7d4c;
  --code-keyword: #8e3cba;
  --code-number: #a35100;
  --code-tag: #1c5cab;
  --code-attr: #8a5d00;
  --code-key: #0f6e7a;
  --diff-add: color-mix(in srgb, var(--status-good) 14%, var(--surface-1));
  --diff-del: color-mix(in srgb, var(--status-critical) 12%, var(--surface-1));
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    color-scheme: dark;
    --page: #121211;
    --surface-1: #1a1a19;
    --surface-2: #222220;
    --surface-3: #2c2c2a;
    --border: #2f2f2c;
    --border-strong: #45453f;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #a3a29b;
    --link: #86b6ef;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
    --status-good-text: #0ca30c;
    --code-bg: #141413;
    --code-text: #f0efec;
    --code-comment: #a3a29b;
    --code-string: #5fd09a;
    --code-keyword: #c99bf0;
    --code-number: #f0a35a;
    --code-tag: #86b6ef;
    --code-attr: #e2c06f;
    --code-key: #6fd3df;
  }
}

:root[data-theme='dark'] {
  color-scheme: dark;
  --page: #121211;
  --surface-1: #1a1a19;
  --surface-2: #222220;
  --surface-3: #2c2c2a;
  --border: #2f2f2c;
  --border-strong: #45453f;
  --text-primary: #f0efec;
  --text-secondary: #c3c2b7;
  --text-muted: #a3a29b;
  --link: #86b6ef;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
  --status-good-text: #0ca30c;
  --code-bg: #141413;
  --code-text: #f0efec;
  --code-comment: #a3a29b;
  --code-string: #5fd09a;
  --code-keyword: #c99bf0;
  --code-number: #f0a35a;
  --code-tag: #86b6ef;
  --code-attr: #e2c06f;
  --code-key: #6fd3df;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--page);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: 600; line-height: 1.2; margin: 0; }
a { color: var(--link); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
p { margin: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.muted { color: var(--text-muted); }
code, .code { font-family: var(--font-mono); font-size: 0.85em; }
[hidden] { display: none !important; }

/* ---------- Buttons, chips, inputs (Cookies Atlas) ---------- */

.button { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 6px 14px; border: 1px solid var(--border-strong); border-radius: 999px; background: var(--surface-1); cursor: pointer; font-weight: 600; font-size: 0.92rem; white-space: nowrap; text-decoration: none; color: var(--text-primary); }
.button:hover { background: var(--surface-2); }
.button:disabled { opacity: 0.6; cursor: progress; }
.button-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.button-primary:hover { background: var(--accent-hover); }
.button-ghost { border-color: transparent; background: transparent; color: var(--text-secondary); }
.button-ghost:hover { background: var(--surface-2); color: var(--text-primary); }
.button.small { min-height: 30px; padding: 3px 11px; font-size: 0.86rem; }

.icon-button { display: inline-grid; place-items: center; width: 36px; height: 36px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-1); color: var(--text-secondary); cursor: pointer; text-decoration: none; }
.icon-button:hover { color: var(--text-primary); background: var(--surface-2); }
.icon-button.small { width: 28px; height: 28px; border-radius: 8px; }

.text-button, .link-button { border: 0; background: none; padding: 0; color: var(--link); cursor: pointer; text-align: left; display: inline-flex; align-items: center; gap: 4px; }
.text-button:hover, .link-button:hover { text-decoration: underline; }
.text-button.small { font-size: 0.85rem; }

.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 3px 11px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface-1); font-size: 0.88rem; cursor: pointer; color: var(--text-secondary); }
.chip:hover { border-color: var(--border-strong); color: var(--text-primary); }
.chip[aria-pressed='true'] { background: var(--text-primary); border-color: var(--text-primary); color: var(--surface-1); }
.chip .chip-x { display: inline-flex; color: var(--text-muted); }
.chip-static { cursor: default; }

.badge { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--surface-3); color: var(--text-secondary); font-size: 0.75rem; font-weight: 600; white-space: nowrap; }
.badge-warn { background: color-mix(in srgb, var(--status-warning) 22%, var(--surface-1)); color: var(--text-primary); }
.badge-good { background: color-mix(in srgb, var(--status-good) 16%, var(--surface-1)); color: var(--status-good-text); }

input[type='text'], input[type='search'], input[type='number'], input[type='url'], input[type='email'], select, textarea {
  width: 100%; min-height: 38px; padding: 7px 11px; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--surface-1);
}
textarea { min-height: 96px; resize: vertical; font-family: var(--font-mono); font-size: 0.84rem; line-height: 1.45; }
input::placeholder, textarea::placeholder { color: var(--text-muted); }
input[aria-invalid='true'], textarea[aria-invalid='true'] { border-color: var(--status-critical); }
input[type='checkbox'], input[type='radio'] { accent-color: var(--text-primary); }

.field { display: flex; flex-direction: column; gap: 4px; font-size: 0.88rem; color: var(--text-secondary); }
.field > span:first-child, .field > label > span.label { font-weight: 600; }
.field-hint { font-size: 0.82rem; color: var(--text-muted); }
.field-error { display: flex; align-items: flex-start; gap: 6px; color: var(--text-primary); font-size: 0.85rem; }
.field-error .icon { color: var(--status-critical); flex: none; margin-top: 2px; }
.field-warn .icon { color: var(--status-warning); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }

.segmented, fieldset.segmented { border: 0; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.segmented legend { font-size: 0.88rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; padding: 0; }
.segmented label { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border: 1px solid var(--border); border-radius: 999px; font-size: 0.88rem; cursor: pointer; background: var(--surface-1); }
.segmented label:has(input:checked) { border-color: var(--text-primary); background: var(--surface-2); }
.segmented input { accent-color: var(--text-primary); margin: 0; }

.segmented-mini { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; padding: 2px; background: var(--surface-1); }
.segmented-mini button { border: 0; background: none; border-radius: 999px; padding: 4px 10px; font-size: 0.82rem; font-weight: 600; color: var(--text-secondary); cursor: pointer; }
.segmented-mini button[aria-pressed='true'] { background: var(--text-primary); color: var(--surface-1); }

.check { display: flex; align-items: flex-start; gap: 8px; font-size: 0.92rem; color: var(--text-primary); cursor: pointer; }
.check input { margin: 3px 0 0; flex: none; }
.check small { display: block; color: var(--text-muted); font-size: 0.82rem; }

/* ---------- Layout (Cookies Atlas chrome) ---------- */

.app { min-height: 100vh; display: flex; flex-direction: column; }
.app-header { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px; padding: 10px 24px; background: color-mix(in srgb, var(--surface-1) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--text-primary); text-decoration: none; font-family: var(--font-heading); font-weight: 700; font-size: 1.1rem; white-space: nowrap; }
.logo-globe { fill: var(--text-primary); }
.logo-lines { fill: none; stroke: var(--surface-1); stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.logo-bite { fill: var(--accent); stroke: var(--text-primary); stroke-width: 1.5; }
.header-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.header-note { font-size: 0.86rem; color: var(--text-muted); }
.app-main { flex: 1; width: 100%; max-width: 1520px; margin: 0 auto; padding: 20px 24px 32px; }
.app-footer { border-top: 1px solid var(--border); padding: 16px 24px 24px; color: var(--text-muted); font-size: 0.85rem; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; }
.app-footer p { margin: 0; max-width: 900px; }
.app-footer nav { display: flex; gap: 16px; flex-wrap: wrap; }

.intro { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 24px; margin-bottom: 16px; }
.intro h1 { font-size: clamp(1.5rem, 3vw, 1.9rem); }
.lead { color: var(--text-secondary); font-size: 1.02rem; max-width: 760px; margin-top: 4px; }

.layout { display: grid; grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr); gap: 16px; align-items: start; }
.layout.client { grid-template-columns: minmax(0, 1fr); max-width: 1100px; margin: 0 auto; }

.card, .panel { background: var(--surface-1); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); min-width: 0; }

/* ---------- Wizard ---------- */

.wizard { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.step-nav { display: flex; flex-wrap: wrap; gap: 6px; }
.step-nav a { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface-1); color: var(--text-secondary); font-size: 0.84rem; text-decoration: none; }
.step-nav a:hover { border-color: var(--border-strong); color: var(--text-primary); }
.step-num { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--surface-3); font-family: var(--font-heading); font-weight: 700; font-size: 0.8rem; color: var(--text-primary); flex: none; }
.step-nav a .step-num { width: 18px; height: 18px; font-size: 0.72rem; }
.step { scroll-margin-top: 76px; }
.step > summary { display: flex; align-items: center; gap: 10px; padding: 14px 16px; cursor: pointer; list-style: none; border-radius: 16px; }
.step > summary::-webkit-details-marker { display: none; }
.step > summary h2 { font-size: 1.05rem; }
.step > summary .step-summary { margin-left: auto; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; }
.step > summary .chevron { color: var(--text-muted); display: inline-flex; transition: transform 0.15s ease; flex: none; }
.step[open] > summary .chevron { transform: rotate(180deg); }
.step[open] > summary { border-bottom: 1px solid var(--border); border-radius: 16px 16px 0 0; }
.step-body { padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.step-intro { color: var(--text-secondary); font-size: 0.92rem; }
.subcard { border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--surface-1); }
.subcard h3 { font-size: 0.95rem; }
.subcard-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.row-top { align-items: flex-start; }
.grow { flex: 1 1 200px; min-width: 0; }
.note { padding: 10px 12px; border-radius: 10px; background: var(--surface-2); color: var(--text-secondary); font-size: 0.88rem; display: flex; gap: 8px; align-items: flex-start; }
.note .icon { flex: none; margin-top: 2px; color: var(--text-muted); }
.note p + p { margin-top: 4px; }
.alert { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); border-left: 4px solid var(--border-strong); font-size: 0.9rem; display: flex; gap: 8px; align-items: flex-start; background: var(--surface-1); }
.alert .icon { flex: none; margin-top: 2px; }
.alert-error { border-left-color: var(--status-critical); }
.alert-error .icon { color: var(--status-critical); }
.alert-warning { border-left-color: var(--status-warning); }
.alert-warning .icon { color: var(--status-warning); }
.alert-info .icon { color: var(--text-muted); }
.alert-good { border-left-color: var(--status-good); }
.alert-good .icon { color: var(--status-good); }
.alert strong { font-family: var(--font-heading); }
.alert p + p { margin-top: 4px; }

.project-row { display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 14px; border: 1px solid var(--border-strong); border-radius: 999px; background: var(--surface-1); color: var(--text-muted); }
.project-row:focus-within { outline: 2px solid var(--focus); outline-offset: 1px; }
.project-row input { border: 0; min-height: 34px; padding: 4px 0; background: transparent; font-family: var(--font-mono); font-size: 0.92rem; color: var(--text-primary); outline: none; }
.recent { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 0.86rem; color: var(--text-muted); }

.project-summary { display: flex; flex-direction: column; gap: 10px; }
.project-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.project-head h3 { font-size: 1.05rem; overflow-wrap: anywhere; }
.facts { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.fact { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; background: var(--surface-1); border: 1px solid var(--border); font-size: 0.84rem; color: var(--text-secondary); }
.fact-good .icon { color: var(--status-good); }
.fact-warn .icon { color: var(--status-warning); }
.fact-warn { border-color: color-mix(in srgb, var(--status-warning) 55%, var(--border)); }
.table-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; }
table.mini { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
table.mini th, table.mini td { text-align: left; vertical-align: top; padding: 6px 9px; border-bottom: 1px solid var(--border); overflow-wrap: anywhere; }
table.mini thead th { background: var(--surface-2); color: var(--text-secondary); font-weight: 600; white-space: nowrap; }

<script>
'use strict';
/* =============================================================================================
   PURE LOGIC: window.SnippetGenerator
   state → settings object → code strings, the snippet parser, the audit rules and the URL codec.
   No DOM access in this section (tests call it directly).
   ============================================================================================= */
(function () {
// ---------------------------------------------------------------------------------------------
// Constants (sections 2 to 4 of SPEC.md, re-read from sdk.js build 2026-10-28T21:27:12Z)
// ---------------------------------------------------------------------------------------------

const SDK_BUILD = '2026-10-28T21:27:12Z';
const STATE_VERSION = 1;
const PROJECT_ID_RE = /^[a-f0-9]{24}$/i;
const PLACEHOLDER_ID = 'PROJECT_ID';
const PLACEHOLDER_DOMAIN = 'YOUR_DOMAIN';

const BRANDS_URL = (id) => `https://client.axept.io/projectconfigurations/brands/${id}.json`;
const TCF_URL = (id) => `https://client.axept.io/tcf/${id}.json`;
const ADMIN_URL = (id) => `https://admin.axeptio.eu/projects/${id}/cookies`;
const ATLAS_URL = (id, html) =>
  `https://pggpgg.github.io/cookies-atlas/${id ? `?project=${encodeURIComponent(id)}${html ? '&logic=html' : ''}` : ''}`;

// The two loaders, byte for byte as the back office gives them (protocol-relative on purpose).
const LOADERS = {
  brands:
    '(function(d, s) {\n' +
    '  var t = d.getElementsByTagName(s)[0], e = d.createElement(s);\n' +
    '  e.async = true; e.src = "//static.axept.io/sdk.js";\n' +
    '  t.parentNode.insertBefore(e, t);\n' +
    '})(document, "script");',
  tcf:
    '(function(d, s) {\n' +
    '  var t = d.getElementsByTagName(s)[0], e = d.createElement(s);\n' +
    '  e.async = true; e.src = "//static.axept.io/tcf/sdk.js"; e.type = "module";\n' +
    '  t.parentNode.insertBefore(e, t);\n' +
    '})(document, "script");',
};

// Consent Mode v2 types, in the order of Pierre's standard output (SPEC 3.1).
const GCM_TYPES = ['analytics_storage', 'ad_storage', 'ad_user_data', 'ad_personalization'];
const GCM_OPTIONAL_TYPES = ['functionality_storage', 'personalization_storage', 'security_storage'];
const GCM_ALL_TYPES = [...GCM_TYPES, ...GCM_OPTIONAL_TYPES];

// Region presets (chips append them to the opt-out list).
const PRESETS = {
  caExceptQc: ['CA-AB', 'CA-BC', 'CA-MB', 'CA-NB', 'CA-NL', 'CA-NS', 'CA-NT', 'CA-NU', 'CA-ON', 'CA-PE', 'CA-SK', 'CA-YT'],
  us: ['US'],
};

// Step layouts whose vendors need no consent (sdk.js keeps them in the "non-optional" list).
const NON_OPTIONAL_LAYOUTS = new Set(['info', 'partners']);
const OPT_OUT_REGULATIONS = new Set(['ccpa', 'gpp']);

/**
 * The brands SDK settings catalogue (SPEC 2.3), the expert-mode source of truth.
 * src: 'doc' (help center), 'sdk' (in sdk.js, undocumented), 'internal' (read-only, never offered).
 * tcf: read by tcf/sdk.js too (SPEC 2.4).
 */
const CATALOGUE = [
  { key: 'clientId', type: 'string', src: 'doc', tcf: true },
  { key: 'cookiesVersion', type: 'cookiesVersion', src: 'doc', tcf: true },
  { key: 'useDocumentLang', type: 'boolean', def: false, src: 'doc' },
  { key: 'userCookiesDomain', type: 'string', src: 'doc', tcf: true },
  { key: 'userCookiesDuration', type: 'duration', def: 190, src: 'doc' },
  { key: 'userCookiesSecure', type: 'boolean', def: true, src: 'doc', tcf: true },
  { key: 'userCookiesSameSite', type: 'enum', values: ['Lax', 'Strict', 'None'], src: 'doc', tcf: true },
  { key: 'jsonCookieName', type: 'string', def: 'axeptio_cookies', src: 'doc' },
  { key: 'authorizedVendorsCookieName', type: 'string', def: 'axeptio_authorized_vendors', src: 'doc' },
  { key: 'allVendorsCookieName', type: 'string', def: 'axeptio_all_vendors', src: 'doc' },
  { key: 'triggerGTMEvents', type: 'enum', values: [true, false, 'update_only'], def: true, src: 'doc', tcf: true },
  { key: 'dataLayerName', type: 'string', def: 'dataLayer', src: 'doc', tcf: true },
  { key: 'googleConsentMode', type: 'object', src: 'doc', tcf: true },
  { key: 'openCookiesWidgetIfVendorsMismatch', type: 'boolean', def: false, src: 'doc' },
  { key: 'mountClassName', type: 'string', def: 'axeptio_mount', src: 'doc' },
  { key: 'apiUrl', type: 'string', def: 'https://api.axept.io/v1', src: 'doc' },
  { key: 'token', type: 'string', src: 'doc' },
  { key: 'tokenInstance', type: 'string', src: 'doc' },
  { key: 'nonce', type: 'string', src: 'sdk', tcf: true },
  { key: 'gppCookieName', type: 'string', def: 'axeptio_gpp_string', src: 'sdk' },
  { key: 'proxyBaseUrl', type: 'string', src: 'sdk' },
  { key: 'postConsentUrl', type: 'string', def: 'https://api.axept.io/v1/app', src: 'sdk' },
  { key: 'configUrl', type: 'string', def: 'https://client.axept.io/projectconfigurations/brands', src: 'sdk' },
  { key: 'userCrossCookiesDomain', type: 'array', src: 'sdk', tcf: true },
  { key: 'signalEssential', type: 'boolean', def: false, src: 'sdk' },
  { key: 'compressUserCookie', type: 'enum', values: [false, true, 'forced'], def: false, src: 'sdk' },
  { key: 'metadataPrefix', type: 'string', def: '$$', src: 'sdk', tcf: true },
  { key: 'projectId', type: 'string', src: 'sdk', tcfOnly: true },
  { key: 'configurationId', type: 'string', src: 'sdk', tcfOnly: true },
  { key: 'rejectCookiesOnInit', type: 'boolean', src: 'internal' },
  { key: 'restrictedMode', type: 'boolean', def: false, src: 'internal' },
  { key: 'appSDKMode', type: 'boolean', def: false, src: 'internal', tcf: true },
  { key: 'platform', type: 'string', src: 'internal' },
  { key: 'sdkVersion', type: 'string', src: 'internal', tcf: true },
];
const CATALOGUE_BY_KEY = new Map(CATALOGUE.map((c) => [c.key, c]));
// Fields the SDK writes itself: never offered, flagged if pasted.
const SDK_INTERNAL_FIELDS = new Set([
  'countryCode', 'subdivisionCode', 'reglementation', 'isFallback', 'userLanguage', 'consentDefaultAlreadySent',
  'consentUpdateAlreadySent', 'cookiesConfig', 'directConfigUrl',
]);
const isTcfKey = (key) => {
  const c = CATALOGUE_BY_KEY.get(key);
  return Boolean(c && (c.tcf || c.tcfOnly));
};
const catalogueFor = (sdk) => CATALOGUE.filter((c) => (sdk === 'tcf' ? c.tcf || c.tcfOnly : !c.tcfOnly));

// ---------------------------------------------------------------------------------------------
// ISO 3166 (country list from Cookies Atlas src/engine/iso-3166.ts)
// ---------------------------------------------------------------------------------------------

const ISO_3166_1 = new Set(
  (
    'AD AE AF AG AI AL AM AO AQ AR AS AT AU AW AX AZ BA BB BD BE BF BG BH BI BJ BL BM BN BO BQ BR BS BT BV BW BY BZ ' +
    'CA CC CD CF CG CH CI CK CL CM CN CO CR CU CV CW CX CY CZ DE DJ DK DM DO DZ EC EE EG EH ER ES ET FI FJ FK FM FO FR ' +
    'GA GB GD GE GF GG GH GI GL GM GN GP GQ GR GS GT GU GW GY HK HM HN HR HT HU ID IE IL IM IN IO IQ IR IS IT JE JM JO JP ' +
    'KE KG KH KI KM KN KP KR KW KY KZ LA LB LC LI LK LR LS LT LU LV LY MA MC MD ME MF MG MH MK ML MM MN MO MP MQ MR MS MT ' +
    'MU MV MW MX MY MZ NA NC NE NF NG NI NL NO NP NR NU NZ OM PA PE PF PG PH PK PL PM PN PR PS PT PW PY QA RE RO RS RU RW ' +
    'SA SB SC SD SE SG SH SI SJ SK SL SM SN SO SR SS ST SV SX SY SZ TC TD TF TG TH TJ TK TL TM TN TO TR TT TV TW TZ UA UG ' +
    'UM US UY UZ VA VC VE VG VI VN VU WF WS YE YT ZA ZM ZW XK'
  ).split(' '),
);
const COUNTRY_CODE_FIXES = { UK: 'GB', EL: 'GR', EN: 'GB' };
// First-level regions known in full (the ones Consent Mode setups use most).
const SUBDIVISIONS = {
  CA: new Set('AB BC MB NB NL NS NT NU ON PE QC SK YT'.split(' ')),
  US: new Set(
    ('AL AK AZ AR CA CO CT DE FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA ' +
      'RI SC SD TN TX UT VT VA WA WV WI WY DC').split(' '),
  ),
};
// US territories: written as US subdivisions in some tables, but located as countries (US-PR → PR).
const US_TERRITORIES = new Set(['AS', 'GU', 'MP', 'PR', 'UM', 'VI']);

/**
 * Checks one Consent Mode region code.
 * Returns { code, ok, fixed, issue } where issue is one of lowercase, spaces, territory, alias,
 * unknownCountry, unknownSubdivision, format (null when fine).
 */
function checkRegionCode(raw) {
  const code = String(raw ?? '');
  const trimmed = code.replace(/\s+/g, '');
  const upper = trimmed.toUpperCase();
  let issue = null;
  let fixed = upper;
  if (/\s/.test(code)) issue = 'spaces';
  else if (trimmed !== upper) issue = 'lowercase';
  const m = /^([A-Z]{2})(?:-([A-Z0-9]{1,3}))?$/.exec(upper);
  if (!m) return { code, ok: false, fixed: null, issue: 'format' };
  const [, cc, sub] = m;
  if (COUNTRY_CODE_FIXES[cc]) {
    fixed = sub ? `${COUNTRY_CODE_FIXES[cc]}-${sub}` : COUNTRY_CODE_FIXES[cc];
    return { code, ok: false, fixed, issue: 'alias' };
  }
  if (!ISO_3166_1.has(cc)) return { code, ok: false, fixed: null, issue: 'unknownCountry' };
  if (cc === 'US' && sub && US_TERRITORIES.has(sub)) return { code, ok: false, fixed: sub, issue: 'territory' };
  if (sub && SUBDIVISIONS[cc] && !SUBDIVISIONS[cc].has(sub)) return { code, ok: false, fixed: null, issue: 'unknownSubdivision' };
  return { code, ok: issue === null, fixed, issue };
}

// ---------------------------------------------------------------------------------------------
// Small helpers
// ---------------------------------------------------------------------------------------------

const isObj = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);
const str = (v) => (typeof v === 'string' ? v : v === undefined || v === null ? '' : String(v));
const clone = (v) => (v === undefined ? undefined : JSON.parse(JSON.stringify(v)));
const uniq = (list) => [...new Set(list)];
const asList = (v) => (Array.isArray(v) ? v.filter((x) => x !== null && x !== undefined && x !== '') : v ? [v] : []);
const plural = (n, one, many) => (n === 1 ? one : many);
const isIdentifier = (k) => /^[A-Za-z_$][A-Za-z0-9_$]*$/.test(k);

function deepEqual(a, b) {
  if (a === b) return true;
  if (typeof a !== typeof b || a === null || b === null || typeof a !== 'object') return false;
  if (Array.isArray(a) !== Array.isArray(b)) return false;
  const ka = Object.keys(a);
  const kb = Object.keys(b);
  if (ka.length !== kb.length) return false;
  return ka.every((k) => Object.prototype.hasOwnProperty.call(b, k) && deepEqual(a[k], b[k]));
}

function levenshtein(a, b) {
  if (a === b) return 0;
  const m = a.length;
  const n = b.length;
  if (!m) return n;
  if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}

/** Closest catalogue key for a misspelled one (Levenshtein ≤ 2, also after folding Language/Cookie/case). */
function suggestKey(key, sdk) {
  const fold = (k) => k.toLowerCase().replace(/language/g, 'lang').replace(/cookies/g, 'cookie');
  let best = null;
  let bestScore = Infinity;
  for (const c of catalogueFor(sdk)) {
    if (c.src === 'internal') continue;
    const d = Math.min(levenshtein(key, c.key), levenshtein(fold(key), fold(c.key)));
    if (d <= 2 && d < bestScore) {
      best = c.key;
      bestScore = d;
    }
  }
  return best;
}

function listFormat(items, locale) {
  const list = items.filter(Boolean);
  try {
    return new Intl.ListFormat(locale, { style: 'long', type: 'conjunction' }).format(list);
  } catch {
    return list.join(', ');
  }
}

function formatDate(iso, locale) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso);
  try {
    return new Intl.DateTimeFormat(locale, { year: 'numeric', month: 'long', day: 'numeric' }).format(d);
  } catch {
    return d.toISOString().slice(0, 10);
  }
}

// ---------------------------------------------------------------------------------------------
// Domains
// ---------------------------------------------------------------------------------------------

// Two-level public suffixes worth knowing (co.uk, com.au, qc.ca, gc.ca...). Anything that looks like
// one but isn't listed makes the guess "unsure", and the wizard asks.
const TWO_LEVEL_SUFFIXES = new Set(
  (

const GENERIC_SECOND_LEVEL = new Set(['com', 'net', 'org', 'co', 'ac', 'gov', 'gob', 'edu', 'nom', 'or', 'ne', 'go']);

/** "https://Shop.Example.com:8080/x" → "shop.example.com" (null when unreadable). */
function hostFromUrl(text) {
  const raw = str(text).trim();
  if (!raw) return null;
  try {
    const url = new URL(/^[a-z][a-z0-9+.-]*:\/\//i.test(raw) ? raw : `https://${raw.replace(/^\/\//, '')}`);
    const host = url.hostname.toLowerCase().replace(/\.$/, '');
    return host.includes('.') || host === 'localhost' ? host : null;
  } catch {
    return null;
  }
}

/** Registrable domain of a host: { domain, sure }. IPs and localhost give null. */
function registrableDomain(host) {
  const h = str(host).toLowerCase().replace(/^\.+|\.+$/g, '');
  if (!h || h === 'localhost' || /^\d+(\.\d+){3}$/.test(h) || h.includes(':')) return { domain: null, sure: false };
  const labels = h.split('.');
  if (labels.length < 2) return { domain: null, sure: false };
  const lastTwo = labels.slice(-2).join('.');
  if (TWO_LEVEL_SUFFIXES.has(lastTwo)) {
    return labels.length >= 3 ? { domain: labels.slice(-3).join('.'), sure: true } : { domain: null, sure: false };
  }
  const tld = labels[labels.length - 1];
  const second = labels[labels.length - 2];
  const looksTwoLevel = tld.length === 2 && GENERIC_SECOND_LEVEL.has(second);
  if (looksTwoLevel) {
    return labels.length >= 3 ? { domain: labels.slice(-3).join('.'), sure: false } : { domain: lastTwo, sure: false };
  }
  return { domain: lastTwo, sure: true };
}

/**
 * Cleans a domain written by hand for userCookiesDomain or the cross-domain list.
 * Returns { value, fixed, issues } with issues among protocol, path, www, dot, port, case, space, invalid.
 */
function cleanDomain(raw) {
  const value = str(raw);
  const issues = [];
  let d = value.trim();
  if (d !== value || /\s/.test(d)) issues.push('space');
  d = d.replace(/\s+/g, '');
  if (/^[a-z][a-z0-9+.-]*:\/\//i.test(d) || d.startsWith('//')) {
    issues.push('protocol');
    d = d.replace(/^[a-z][a-z0-9+.-]*:\/\//i, '').replace(/^\/\//, '');
  }
  if (/[/?#]/.test(d)) {
    issues.push('path');
    d = d.split(/[/?#]/)[0];
  }
  if (/:\d+$/.test(d)) {
    issues.push('port');
    d = d.replace(/:\d+$/, '');
  }
  if (d !== d.toLowerCase()) {
    issues.push('case');
    d = d.toLowerCase();
  }
  if (d.startsWith('.')) {
    issues.push('dot');
    d = d.replace(/^\.+/, '');
  }
  if (d.startsWith('www.')) {
    issues.push('www');
    d = d.slice(4);
  }
  d = d.replace(/\.$/, '');
  if (!/^[a-z0-9-]+(\.[a-z0-9-]+)+$/.test(d)) issues.push('invalid');
  return { value, fixed: d, issues };
}

/** Does a cookie set with Domain=domain reach this host? */
const domainCovers = (domain, host) => Boolean(domain && host && (host === domain || host.endsWith(`.${domain}`)));

const oneOf = (v, allowed, fallback) => (allowed.includes(v) ? v : fallback);
const bool = (v, fallback) => (typeof v === 'boolean' ? v : fallback);
const strList = (v, max = 200) => (Array.isArray(v) ? v.map((x) => str(x).trim()).filter(Boolean).slice(0, max) : []);
const cut = (v, max) => str(v).slice(0, max);

function normalizeValues(v, fallback) {
  const out = {};
  for (const type of GCM_TYPES) out[type] = oneOf(isObj(v) ? v[type] : null, ['granted', 'denied'], fallback);
  return out;
}

function normalizeProject(p) {
  if (!isObj(p)) return null;
  const configs = (list) =>
    (Array.isArray(list) ? list : [])
      .filter(isObj)
      .slice(0, 200)
      .map((c) => ({
        name: cut(c.name, 200),
        lang: cut(c.lang, 20).toLowerCase(),
        country: strList(c.country, 300).map((x) => x.toUpperCase()),
        sub: strList(c.sub, 300).map((x) => x.toUpperCase()),
        reg: cut(c.reg, 40).toLowerCase(),
        gcm: Boolean(c.gcm),
      }));
  const vendors = (list) =>
    (Array.isArray(list) ? list : [])
      .filter(isObj)
      .slice(0, 500)
      .map((v) => ({ name: cut(v.name, 200), title: cut(v.title, 200), essential: Boolean(v.essential) }))
      .filter((v) => v.name);
  return {
    id: cut(p.id, 64).toLowerCase(),
    name: cut(p.name, 300),
    publishedAt: cut(p.publishedAt, 40),
    sdk: oneOf(p.sdk, ['brands', 'tcf', 'both'], 'brands'),
    geo: Boolean(p.geo),
    fallback: p.fallback ? cut(p.fallback, 200) : null,
    restriction: Boolean(p.restriction),
    domains: strList(p.domains, 100).map((d) => d.toLowerCase()),
    configs: configs(p.configs),
    vendors: vendors(p.vendors),
    tcfConfigs: configs(p.tcfConfigs),
    tcfGeo: Boolean(p.tcfGeo),
    tcfVendors: vendors(p.tcfVendors),
    gcmFlags: { redaction: Boolean(p.gcmFlags && p.gcmFlags.redaction), passthrough: Boolean(p.gcmFlags && p.gcmFlags.passthrough) },
  };
}

/** Coerces anything (a decoded link, a test fixture) into a valid state. Idempotent. */
function normalizeState(input) {
  const s = isObj(input) ? input : {};
  const d = defaultState();
  const g = isObj(s.google) ? s.google : {};
  const entry = (e, fallback) => ({
    region: strList(isObj(e) ? e.region : [], 300).map((c) => c.slice(0, 12)),
    values: normalizeValues(isObj(e) ? e.values : null, fallback),
  });
  const wait = Number(g.wait);
  return {
    v: STATE_VERSION,
    sdk: oneOf(s.sdk, ['brands', 'tcf'], 'brands'),
    projectId: cut(s.projectId, 64).trim(),
    project: normalizeProject(s.project),
    siteUrl: cut(s.siteUrl, 300),
    langs: uniq(strList(s.langs, 20).map((l) => l.toLowerCase()).filter((l) => /^[a-z]{2,3}$/.test(l))),
    htmlLang: oneOf(s.htmlLang, ['yes', 'no', 'unsure'], d.htmlLang),
    langLogic: oneOf(s.langLogic, ['auto', 'page', 'browser'], d.langLogic),
    pin: oneOf(s.pin, ['none', 'config', 'page', 'browser'], d.pin),
    pinConfig: cut(s.pinConfig, 200),
    pinCases: (Array.isArray(s.pinCases) ? s.pinCases : [])
      .filter(isObj)
      .slice(0, 30)
      .map((c) => ({ lang: cut(c.lang, 12), config: cut(c.config, 200) })),
    pinDefault: cut(s.pinDefault, 200),
    subdomains: bool(s.subdomains, d.subdomains),
    cookieDomain: cut(s.cookieDomain, 200),
    crossDomain: bool(s.crossDomain, d.crossDomain),
    crossDomains: strList(s.crossDomains, 50).map((x) => x.slice(0, 200)),
    google: {
      on: bool(g.on, d.google.on),
      loading: oneOf(g.loading, ['gtm', 'gtagjs', 'inline', 'unsure'], d.google.loading),
      mode: oneOf(g.mode, ['basic', 'advanced'], d.google.mode),
      owner: oneOf(g.owner, ['auto', 'settings', 'inline'], d.google.owner),
      fallback: normalizeValues(g.fallback, 'denied'),
      optout: entry(g.optout, 'granted'),
      extra: (Array.isArray(g.extra) ? g.extra : []).slice(0, 20).map((e) => entry(e, 'denied')),
      wait: Number.isFinite(wait) && wait >= 0 ? Math.round(Math.min(wait, 60000)) : d.google.wait,
      redaction: bool(g.redaction, d.google.redaction),
      passthrough: bool(g.passthrough, d.google.passthrough),
    },
    vendors: (Array.isArray(s.vendors) ? s.vendors : [])
      .filter(isObj)
      .slice(0, 100)
      .map((v) => ({ name: cut(v.name, 200).trim(), title: cut(v.title, 200), on: Boolean(v.on), code: cut(v.code, 20000) }))
      .filter((v) => v.name),
    link: bool(s.link, d.link),
    linkLabels: Object.fromEntries(
      Object.entries(isObj(s.linkLabels) ? s.linkLabels : {})
        .filter(([k, v]) => /^[a-z]{2,3}$/.test(k) && typeof v === 'string')
        .slice(0, 20)
        .map(([k, v]) => [k, v.slice(0, 120)]),
    ),
    hideButton: bool(s.hideButton, d.hideButton),
    csp: bool(s.csp, d.csp),
    nonce: cut(s.nonce, 200),
    preconnect: bool(s.preconnect, d.preconnect),
    duration: cut(s.duration, 20).trim(),
    sameSite: oneOf(s.sameSite, ['', 'Lax', 'Strict', 'None'], d.sameSite),
    secure: bool(s.secure, d.secure),
    dataLayerName: cut(s.dataLayerName, 100).trim(),
    gtmEvents: oneOf(s.gtmEvents, ['true', 'false', 'update_only'], d.gtmEvents),
    vendorsMismatch: bool(s.vendorsMismatch, d.vendorsMismatch),
    expert: {
      set: Object.fromEntries(
        Object.entries(isObj(s.expert) && isObj(s.expert.set) ? s.expert.set : {}).filter(([k, v]) => CATALOGUE_BY_KEY.has(k) && v !== undefined),
      ),
      pin: uniq(strList(isObj(s.expert) ? s.expert.pin : [], 60).filter((k) => CATALOGUE_BY_KEY.has(k))),
      custom: (isObj(s.expert) && Array.isArray(s.expert.custom) ? s.expert.custom : [])
        .filter(isObj)
        .slice(0, 30)
        .map((c) => ({ key: cut(c.key, 100).trim(), value: cut(c.value, 5000) })),
    },
    share: {
      name: cut(isObj(s.share) ? s.share.name : '', 120),
      contact: cut(isObj(s.share) ? s.share.contact : '', 160),
      note: cut(isObj(s.share) ? s.share.note : '', 2000),
    },
  };
}

/** A full, normalized state from a partial one (tests and the UI build states this way). */
function makeState(partial) {
  const base = defaultState();
  const p = isObj(partial) ? partial : {};
  return normalizeState({ ...base, ...p, google: { ...base.google, ...(isObj(p.google) ? p.google : {}) }, expert: { ...base.expert, ...(isObj(p.expert) ? p.expert : {}) } });
}

// ---------------------------------------------------------------------------------------------
// Project files → snapshot (SPEC 4.1)
// ---------------------------------------------------------------------------------------------

/**
 * Builds the project snapshot from the public brands file and, when published, the TCF file.
 * Returns { project } or { error } (notFound | invalid | empty).
 */
function projectFromFiles(id, brands, tcf) {
  const brandsOk = isObj(brands) && brands.isEmpty !== true && Array.isArray(brands.cookies) && brands.cookies.length > 0;
  const tcfOk = isObj(tcf) && tcf.isEmpty !== true && Array.isArray(tcf.consents) && tcf.consents.length > 0;
  if (!brandsOk && !tcfOk) {
    if (isObj(brands) && brands.isEmpty !== true && Array.isArray(brands.cookies)) return { error: 'empty' };
    if ((isObj(brands) && brands.isEmpty === true) || (isObj(tcf) && tcf.isEmpty === true) || (!brands && !tcf)) return { error: 'notFound' };
    return { error: 'invalid' };
  }
  const main = brandsOk ? brands : tcf;
  const settings = brandsOk ? (isObj(brands.client) && isObj(brands.client.cookiesSettings) ? brands.client.cookiesSettings : {}) : {};
  const cfgs = brandsOk ? brands.cookies.filter(isObj) : [];
  const byId = new Map(cfgs.map((c) => [c.identifier, c]));
  const fallbackCfg = settings.geolocationFallbackConfigId ? byId.get(settings.geolocationFallbackConfigId) : null;
  const vendorMap = new Map();
  for (const c of cfgs) {
    for (const step of Array.isArray(c.steps) ? c.steps : []) {
      if (!isObj(step) || !Array.isArray(step.vendors)) continue;
      const essential = NON_OPTIONAL_LAYOUTS.has(str(step.layout));
      for (const v of step.vendors) {
        if (!isObj(v) || !v.name) continue;
        const prev = vendorMap.get(v.name);
        vendorMap.set(v.name, { name: str(v.name), title: str(v.title || v.name), essential: prev ? prev.essential && essential : essential });
      }
    }
  }
  const tcfCfgs = tcfOk ? tcf.consents.filter(isObj) : [];
  const tcfVendors = new Map();
  for (const c of tcfCfgs) {
    for (const v of Array.isArray(c.vendors) ? c.vendors : []) {
      if (isObj(v) && v.name && (v.iabId === null || v.iabId === undefined)) tcfVendors.set(v.name, { name: str(v.name), title: str(v.title || v.name), essential: false });
    }
  }
  const tcfSub = (c) =>
    asList(c.subdivision).map((sub) => {
      const s = str(sub).toUpperCase();
      return s.includes('-') ? s : asList(c.country).length === 1 ? `${str(asList(c.country)[0]).toUpperCase()}-${s}` : s;
    });
  const project = normalizeProject({
    id: str(main.projectId || id),
    name: str(main.projectName || id),
    publishedAt: str(main.publishedAt),
    sdk: brandsOk && tcfOk ? 'both' : brandsOk ? 'brands' : 'tcf',
    geo: Boolean(settings.geolocation),
    fallback: fallbackCfg ? str(fallbackCfg.name || fallbackCfg.title || fallbackCfg.identifier) : null,
    restriction: Boolean(main.isDomainRestrictionEnabled),
    domains: asList(main.verifiedDomains).map((d) => cleanDomain(isObj(d) ? d.domain || d.url || '' : d).fixed).filter(Boolean),
    configs: cfgs.map((c) => ({
      name: str(c.name || c.title || c.identifier),
      lang: str(c.language),
      country: asList(c.country).map(str),
      sub: asList(c.subdivision).map(str),
      reg: str(c.regulation),
      gcm: isObj(c.googleConsentMode) && c.googleConsentMode.display === true,
    })),
    vendors: [...vendorMap.values()],
    tcfConfigs: tcfCfgs.map((c) => ({
      name: str(c.name || c.title || c.identifier),
      lang: str(c.language),
      country: asList(c.country).map(str),
      sub: tcfSub(c),
      reg: '',
      gcm: isObj(c.google_consent_mode),
    })),
    tcfGeo: Boolean(tcfOk && isObj(tcf.settings) && tcf.settings.geolocation),
    tcfVendors: [...tcfVendors.values()],
    gcmFlags: {
      redaction: cfgs.some((c) => isObj(c.googleConsentMode) && c.googleConsentMode.ads_data_redaction === true),
      passthrough: cfgs.some((c) => isObj(c.googleConsentMode) && c.googleConsentMode.url_passthrough === true),
    },
  });
  return { project };
}

/** What a freshly loaded project pre-fills (the user can change everything after). */
function applyProject(state, project, opts = {}) {
  const s = normalizeState(state);
  const p = normalizeProject(project);
  if (!p) return s;
  s.project = p;
  s.projectId = p.id || s.projectId;
  if (!opts.keepSdk) s.sdk = p.sdk === 'tcf' ? 'tcf' : 'brands';
  const configs = s.sdk === 'tcf' ? p.tcfConfigs : p.configs;
  const langs = uniq(configs.map((c) => c.lang.split(/[-_]/)[0]).filter((l) => /^[a-z]{2,3}$/.test(l)));
  if (langs.length) s.langs = langs;
  const googleVendor = p.vendors.some((v) => /^google_(analytics|ads)|^googletagmanager$|^google_tag_manager$/.test(v.name));
  if (configs.some((c) => c.gcm) || googleVendor) s.google.on = true;
  const known = new Map(s.vendors.map((v) => [v.name, v]));
  const offered = (s.sdk === 'tcf' ? p.tcfVendors : p.vendors).filter((v) => !v.essential);
  s.vendors = [
    ...offered.map((v) => known.get(v.name) || { name: v.name, title: v.title, on: false, code: '' }),
    ...s.vendors.filter((v) => !offered.some((o) => o.name === v.name) && (v.on || v.code)),
  ];
  if (s.pin !== 'none' && !s.pinCases.length) s.pinCases = langs.map((l) => ({ lang: l, config: '' }));
  return normalizeState(s);
}

/** Regions of the project's opt-out (CCPA, US states) banners, for the "suggest" chip. */
function suggestOptOutRegions(project) {
  const p = normalizeProject(project);
  if (!p) return [];
  const out = [];
  const optOut = p.configs.filter((c) => OPT_OUT_REGULATIONS.has(c.reg));
  const qcBanner = p.configs.some((c) => c.sub.includes('CA-QC') || (c.reg === 'loi25' && c.country.includes('CA')));
  for (const c of optOut) {
    if (c.sub.length) out.push(...c.sub);
    else
      for (const cc of c.country) {
        if (cc === 'CA' && qcBanner) out.push(...PRESETS.caExceptQc);
        else out.push(cc);
      }
  }
  return uniq(out.map((c) => c.toUpperCase()));
}

// ---------------------------------------------------------------------------------------------
// Derived values
// ---------------------------------------------------------------------------------------------

const siteHost = (s) => hostFromUrl(s.siteUrl);
const projectConfigs = (s) => (s.project ? (s.sdk === 'tcf' ? s.project.tcfConfigs : s.project.configs) : []);
const projectGeo = (s) => (s.project ? (s.sdk === 'tcf' ? s.project.tcfGeo : s.project.geo) : null);

function siteLangs(s) {
  if (s.langs.length) return s.langs;
  return uniq(projectConfigs(s).map((c) => c.lang.split(/[-_]/)[0]).filter(Boolean));
}

/**
 * Pairs of banners in different languages that compete for the same visitors: same selection step
 * (region, single country, several countries, or none) and at least one target in common. The SDK
 * then breaks the tie with the visitor's language.
 */
function overlapPairs(configs) {
  const step = (c) => (c.sub.length ? 'sub' : c.country.length === 1 ? 'single' : c.country.length > 1 ? 'multi' : 'none');
  const targets = (c) => new Set(c.sub.length ? c.sub.map((x) => x.toUpperCase()) : c.country.map((x) => x.toUpperCase()));
  const pairs = [];
  for (let i = 0; i < configs.length; i++) {
    for (let j = i + 1; j < configs.length; j++) {
      const a = configs[i];
      const b = configs[j];
      const la = a.lang.split(/[-_]/)[0];
      const lb = b.lang.split(/[-_]/)[0];
      if (!la || !lb || la === lb || step(a) !== step(b)) continue;
      const ta = targets(a);
      const tb = targets(b);
      if ((ta.size === 0 && tb.size === 0) || [...ta].some((x) => tb.has(x))) pairs.push([a.name, b.name]);
    }
  }
  return pairs;
}

/** Should useDocumentLang be written, and why. */
function languageDecision(s) {
  if (s.sdk === 'tcf') return { value: false, reason: 'tcf' };
  if (s.pin === 'browser') return { value: false, reason: 'pinBrowser' };
  if (s.langLogic === 'page') return { value: true, reason: 'forcedPage' };
  if (s.langLogic === 'browser') return { value: false, reason: 'forcedBrowser' };
  if (siteLangs(s).length < 2) return { value: false, reason: 'single' };
  if (s.htmlLang !== 'yes') return { value: false, reason: 'html' };
  const configs = projectConfigs(s);
  if (s.project && configs.length) {
    if (!projectGeo(s)) return { value: false, reason: 'geoOff' };
    const pairs = overlapPairs(configs);
    if (!pairs.length) return { value: false, reason: 'noOverlap' };
    return { value: true, reason: 'pageProject', pairs };
  }
  return { value: true, reason: 'pageManual' };
}

function cookiesVersionValue(s) {
  if (s.pin === 'config') return s.pinConfig.trim() || null;
  if (s.pin === 'page' || s.pin === 'browser') {
    const cases = {};
    for (const c of s.pinCases) if (c.lang.trim() && c.config.trim()) cases[c.lang.trim()] = c.config.trim();
    if (s.pinDefault.trim()) cases.default = s.pinDefault.trim();
    if (!Object.keys(cases).length) return null;
    return s.pin === 'page'
      ? { type: 'custom_function', config: { function: { $raw: 'function () { return document.documentElement.lang; }' } }, cases }
      : { type: 'browser_locale', cases };
  }
  return null;
}

/** userCookiesDomain to write: { value, derived, sure, issues } (value null when unknown). */
function cookieDomainInfo(s) {
  if (s.cookieDomain.trim()) {
    const c = cleanDomain(s.cookieDomain);
    return { value: c.issues.includes('invalid') ? null : c.fixed, derived: false, sure: true, issues: c.issues, raw: s.cookieDomain };
  }
  const host = siteHost(s);
  const reg = host ? registrableDomain(host) : { domain: null, sure: false };
  return { value: reg.domain, derived: Boolean(reg.domain), sure: reg.sure, issues: [], raw: '' };
}

function crossDomainInfo(s) {
  const list = [];
  const issues = [];
  for (const raw of s.crossDomains) {
    const c = cleanDomain(raw);
    if (c.issues.length) issues.push(c);
    if (!c.issues.includes('invalid') && c.fixed) list.push(c.fixed);
  }
  const host = siteHost(s);
  const self = host ? registrableDomain(host).domain : null;
  let selfAdded = false;
  if (self && list.length && !list.some((d) => domainCovers(d, host))) {
    list.unshift(self);
    selfAdded = true;
  }
  return { list: uniq(list), issues, self, selfAdded };
}

function cleanRegionList(list) {
  const out = [];
  for (const code of list) {
    const r = checkRegionCode(code);
    const value = r.ok ? r.fixed : r.fixed && ['lowercase', 'spaces', 'territory', 'alias'].includes(r.issue) ? checkRegionCode(r.fixed).fixed : null;
    if (value && checkRegionCode(value).ok) out.push(value);
  }
  return uniq(out);
}

function gcmOwner(s) {
  if (!s.google.on) return null;
  if (s.google.owner !== 'auto') return s.google.owner;
  return s.google.loading === 'gtm' ? 'settings' : 'inline';
}

function gcmEntries(s) {
  const g = s.google;
  const entries = [{ ...normalizeValues(g.fallback, 'denied'), wait_for_update: g.wait }];
  const add = (e) => {
    const region = cleanRegionList(e.region);
    if (!region.length) return;
    const values = normalizeValues(e.values, 'denied');
    const denied = GCM_TYPES.some((t) => values[t] === 'denied');
    entries.push(denied ? { ...values, wait_for_update: g.wait, region } : { ...values, region });
  };
  add(g.optout);
  g.extra.forEach(add);
  return entries;
}

function gcmSettingsObject(s) {
  const out = { default: gcmEntries(s) };
  if (s.google.redaction) out.ads_data_redaction = true;
  if (s.google.passthrough) out.url_passthrough = true;
  return out;
}

const durationValue = (v) => (v === 'page' || v === 'session' ? v : /^\d+$/.test(v) ? Number(v) : v);
const dataLayerOf = (s) => (s.dataLayerName && s.dataLayerName !== 'dataLayer' ? s.dataLayerName : 'dataLayer');

/** The keys the wizard answers produce, before expert overrides and the minimal-code filter. */
function wizardSettings(s) {
  const out = new Map();
  out.set('clientId', PROJECT_ID_RE.test(s.projectId) ? s.projectId.toLowerCase() : PLACEHOLDER_ID);
  const cv = cookiesVersionValue(s);
  if (cv !== null) out.set('cookiesVersion', cv);
  if (languageDecision(s).value) out.set('useDocumentLang', true);
  if (s.subdomains) out.set('userCookiesDomain', cookieDomainInfo(s).value || PLACEHOLDER_DOMAIN);
  if (s.duration !== '') out.set('userCookiesDuration', durationValue(s.duration));
  if (!s.secure) out.set('userCookiesSecure', false);
  if (s.sameSite) out.set('userCookiesSameSite', s.sameSite);
  if (s.gtmEvents !== 'true') out.set('triggerGTMEvents', s.gtmEvents === 'false' ? false : 'update_only');
  if (s.dataLayerName && s.dataLayerName !== 'dataLayer') out.set('dataLayerName', s.dataLayerName);
  if (gcmOwner(s) === 'settings') out.set('googleConsentMode', gcmSettingsObject(s));
  if (s.vendorsMismatch) out.set('openCookiesWidgetIfVendorsMismatch', true);
  if (s.csp && s.nonce.trim()) out.set('nonce', s.nonce.trim());
  if (s.sdk === 'tcf' && s.crossDomain) {
    const cd = crossDomainInfo(s);
    if (cd.list.length) out.set('userCrossCookiesDomain', cd.list);
  }
  return out;
}

/** Final axeptioSettings: wizard ⊕ expert, filtered for the SDK and for minimal code. */
function effectiveSettings(s) {
  const wiz = wizardSettings(s);
  const merged = new Map(wiz);
  const src = new Map([...wiz.keys()].map((k) => [k, 'wizard']));
  for (const [k, v] of Object.entries(s.expert.set)) {
    merged.set(k, v);
    src.set(k, 'expert');
  }
  const pins = new Set(s.expert.pin);
  for (const k of pins) {
    const c = CATALOGUE_BY_KEY.get(k);
    if (!merged.has(k) && c && c.def !== undefined) {
      merged.set(k, c.def);
      src.set(k, 'expert');
    }
  }
  const entries = [];
  const dropped = [];
  for (const c of CATALOGUE) {
    if (!merged.has(c.key)) continue;
    const value = merged.get(c.key);
    if (value === undefined || value === null || value === '') continue;
    const allowed = s.sdk === 'tcf' ? c.tcf || c.tcfOnly : !c.tcfOnly;
    if (!allowed) {
      dropped.push(c.key);
      continue;
    }
    if (c.key !== 'clientId' && c.def !== undefined && deepEqual(value, c.def) && !pins.has(c.key)) continue;
    entries.push({ key: c.key, value, src: src.get(c.key) });
  }
  for (const { key, value } of s.expert.custom) {
    if (!key || CATALOGUE_BY_KEY.has(key) || !isIdentifier(key.replace(/[^A-Za-z0-9_$]/g, '_'))) continue;
    entries.push({ key, value: parseCustomValue(value), src: 'custom' });
  }
  return { entries, dropped, object: Object.fromEntries(entries.map((e) => [e.key, e.value])) };
}

function parseCustomValue(text) {
  const t = str(text).trim();
  if (!t) return '';
  const parsed = parseLiteral(t);
  return parsed.ok ? parsed.value : { $raw: t };
}

// ---------------------------------------------------------------------------------------------
// Serialization (JS source, same style as the back office: 2 spaces, double quotes,
// trailing comma after each top-level property)
// ---------------------------------------------------------------------------------------------

const isRaw = (v) => isObj(v) && typeof v.$raw === 'string' && Object.keys(v).length === 1;
const isPrimitive = (v) => v === null || ['string', 'number', 'boolean'].includes(typeof v) || isRaw(v);
const pad = (n) => '  '.repeat(n);

function jsString(value, quote = '"') {
  if (quote === '"') return JSON.stringify(value).replace(/<\/script/gi, '<\\/script');
  return `'${String(value)
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/<\/script/gi, '<\\/script')}'`;
}

const propKey = (k, forceQuotes = false) => (!forceQuotes && isIdentifier(k) ? k : JSON.stringify(k));

function inlineLiteral(v, quote, quoteKeys) {
  if (isRaw(v)) return v.$raw;
  if (v === null) return 'null';
  if (typeof v === 'string') return jsString(v, quote);
  if (typeof v === 'number' || typeof v === 'boolean') return String(v);
  if (Array.isArray(v)) return `[${v.map((x) => inlineLiteral(x, quote)).join(', ')}]`;
  if (isObj(v)) {
    const keys = Object.keys(v);
    return keys.length ? `{ ${keys.map((k) => `${propKey(k, quoteKeys)}: ${inlineLiteral(v[k], quote)}`).join(', ')} }` : '{}';
  }
  return 'undefined';
}

const isFlat = (v) => isPrimitive(v) || (Array.isArray(v) && v.every(isPrimitive));

function literal(v, depth, quote = '"', key = '') {
  if (isPrimitive(v)) return inlineLiteral(v, quote);
  if (Array.isArray(v)) {
    if (v.every(isPrimitive)) return inlineLiteral(v, quote);
    if (v.every((x) => isObj(x) && !isRaw(x) && Object.values(x).every(isFlat))) {
      return `[\n${v.map((x) => pad(depth + 1) + inlineLiteral(x, quote)).join(',\n')}\n${pad(depth)}]`;
    }
    return `[\n${v.map((x) => pad(depth + 1) + literal(x, depth + 1, quote)).join(',\n')}\n${pad(depth)}]`;
  }
  if (isObj(v)) {
    const keys = Object.keys(v);
    if (!keys.length) return '{}';
    const quoteKeys = key === 'cases';
    const flat = keys.every((k) => isPrimitive(v[k]) || (isObj(v[k]) && Object.values(v[k]).every(isPrimitive)));
    const inline = inlineLiteral(v, quote, quoteKeys);
    if (flat && inline.length <= 110 && key !== 'googleConsentMode') return inline;
    return `{\n${keys.map((k) => `${pad(depth + 1)}${propKey(k, quoteKeys)}: ${literal(v[k], depth + 1, quote, k)}`).join(',\n')}\n${pad(depth)}}`;
  }
  return 'undefined';
}

const escapeHtml = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const scriptOpen = (s) => (s.csp && s.nonce.trim() ? `<script nonce="${escapeHtml(s.nonce.trim())}">` : '<script>');

function keyComment(entry, s, t) {
  if (entry.src === 'custom') return null;
  switch (entry.key) {
    case 'cookiesVersion':
      return typeof entry.value === 'string' ? t.code.cookiesVersion(entry.value) : t.code.cookiesVersionDynamic;
    case 'useDocumentLang':
      return entry.value === true ? t.code.useDocumentLang : null;
    case 'userCookiesDomain':
      return t.code.userCookiesDomain(entry.value);
    case 'userCookiesSecure':
      return entry.value === false ? t.code.userCookiesSecure : null;
    case 'googleConsentMode':
      return entry.src === 'wizard' ? t.code.gcmSettings : null;
    case 'nonce':
      return t.code.nonce;
    case 'userCrossCookiesDomain':
      return t.code.userCrossCookiesDomain;
    default:
      return null;
  }
}

function settingsSource(entries, s, t) {
  const lines = ['window.axeptioSettings = {'];
  for (const e of entries) {
    const comment = keyComment(e, s, t);
    if (comment) lines.push(`  // ${comment}`);
    lines.push(`  ${propKey(e.key)}: ${literal(e.value, 1, '"', e.key)},`);
  }
  lines.push('};');
  return lines.join('\n');
}

// ---------------------------------------------------------------------------------------------
// Vendor tags (SPEC 4.4): strip the outer <script>, wrap inline code, load external ones.
// ---------------------------------------------------------------------------------------------

/** Splits a pasted vendor tag into ordered parts: { type: 'src', src, module } | { type: 'inline', code }. */
function splitVendorTag(text) {
  const raw = str(text);
  const notes = [];
  if (!raw.trim()) return { parts: [], notes, globals: [] };
  const parts = [];
  if (/<script\b/i.test(raw)) {
    const re = /<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi;
    let m;
    let rest = raw;
    while ((m = re.exec(raw))) {
      const attrs = parseAttributes(m[1]);
      const type = (attrs.type || '').toLowerCase();
      if (type && !/^(text|application)\/(java|ecma)script$|^module$/.test(type)) continue;
      if (attrs.src) parts.push({ type: 'src', src: attrs.src, module: type === 'module' });
      else if (m[2].trim()) parts.push({ type: 'inline', code: m[2] });
      rest = rest.replace(m[0], '');
    }
    if (/<noscript\b/i.test(rest)) notes.push('noscript');
    const leftover = rest.replace(/<noscript\b[\s\S]*?<\/noscript\s*>/gi, '').replace(/<\!--[\s\S]*?-->/g, '').trim();
    if (leftover) notes.push('otherHtml');
  } else {
    parts.push({ type: 'inline', code: raw });
  }
  const globals = [];
  for (const p of parts) {
    if (p.type !== 'inline') continue;
    globals.push(...topLevelDeclarations(p.code));
    if (/\bdocument\.write(ln)?\s*\(/.test(p.code)) notes.push('docWrite');
  }
  if (parts.some((p) => p.type === 'src')) notes.unshift('external');
  return { parts, notes: uniq(notes), globals: uniq(globals) };
}

function dedent(code) {
  const lines = code.replace(/\r\n?/g, '\n').replace(/^\s*\n|\n\s*$/g, '').split('\n');
  const indents = lines.filter((l) => l.trim()).map((l) => /^[ \t]*/.exec(l)[0].length);
  const min = indents.length ? Math.min(...indents) : 0;
  return lines.map((l) => l.slice(Math.min(min, /^[ \t]*/.exec(l)[0].length)).replace(/\s+$/, ''));
}

function vendorBody(vendor, depth, s, t) {
  const { parts, globals } = splitVendorTag(vendor.code);
  const title = vendor.title || vendor.name;
  if (!parts.length) return [`${pad(depth)}// ${t.code.pasteHere(title)}`];
  const nonceLine = s.csp && s.nonce.trim();
  const out = [];
  const emit = (i, d) => {
    if (i >= parts.length) return;
    const p = parts[i];
    if (p.type === 'inline') {
      for (const line of dedent(p.code.replace(/<\/script/gi, '<\\/script'))) out.push(line ? pad(d) + line : '');
      emit(i + 1, d);
      return;
    }
    const v = i === 0 ? 's' : `s${i}`;
    out.push(`${pad(d)}var ${v} = document.createElement("script");`);
    out.push(`${pad(d)}${v}.src = ${jsString(p.src)};`);
    out.push(`${pad(d)}${v}.async = true;`);
    if (p.module) out.push(`${pad(d)}${v}.type = "module";`);
    if (nonceLine) out.push(`${pad(d)}if (axeptioNonce) { ${v}.nonce = axeptioNonce; }`);
    if (i + 1 < parts.length) {
      out.push(`${pad(d)}${v}.onload = function () {`);
      emit(i + 1, d + 1);
      out.push(`${pad(d)}};`);
    }
    out.push(`${pad(d)}document.head.appendChild(${v});`);
  };
  emit(0, depth);
  for (const name of globals) out.push(`${pad(depth)}window.${name} = ${name}; // ${t.code.keepGlobal}`);
  return out;
}

const choiceAccess = (name) => (isIdentifier(name) ? `choices.${name}` : `choices[${JSON.stringify(name)}]`);

function callbacksCode(s, t) {
  const vendors = s.vendors.filter((v) => v.on);
  const hide = s.hideButton && s.sdk === 'brands';
  if (!vendors.length && !hide) return null;
  const lines = [scriptOpen(s)];
  if (vendors.length) lines.push(`// ${t.code.callbacks}`);
  const needsNonce = s.csp && s.nonce.trim() && vendors.some((v) => splitVendorTag(v.code).parts.some((p) => p.type === 'src'));
  if (needsNonce) lines.push('var axeptioNonce = document.currentScript ? document.currentScript.nonce : "";');
  lines.push('window._axcb = window._axcb || [];');
  lines.push('window._axcb.push(function (axeptio) {');
  if (vendors.length) {
    lines.push('  var loaded = {};');
    lines.push('  function loadOnce(name, load) {');
    lines.push('    if (!loaded[name]) {');
    lines.push('      loaded[name] = true;');
    lines.push('      load();');
    lines.push('    }');
    lines.push('  }');
    lines.push('  axeptio.on("cookies:complete", function (choices) {');
    for (const v of vendors) {
      lines.push(`    if (${choiceAccess(v.name)}) {`);
      lines.push(`      loadOnce(${JSON.stringify(v.name)}, function () {`);
      lines.push(`        // ${(v.title || v.name).replace(/[\r\n]+/g, ' ')}`);
      lines.push(...vendorBody(v, 4, s, t));
      lines.push('      });');
      lines.push('    }');
    }
    lines.push('  });');
  }
  if (hide) {
    lines.push('  axeptio.on("ready", function () {');
    lines.push(`    // ${t.code.hideButton}`);
    lines.push('    if (window.hideAxeptioButton) {');
    lines.push('      window.hideAxeptioButton();');
    lines.push('    }');
    lines.push('  });');
  }
  lines.push('});');
  lines.push('<\/script>');
  return lines.join('\n');
}

function crossDomainCode(list, s, t) {
  const c = t.code.crossDomain;
  return [
    scriptOpen(s),
    `// ${c.intro1}`,
    `// ${c.intro2}`,
    'window._axcb = window._axcb || [];',
    'window._axcb.push(function (axeptio) {',
    `  // ${c.wait}`,
    '  axeptio.on("cookies:complete", function () {',
    `    // ${c.modify1}`,
    `    // ${c.modify2}`,
    `    // ${c.modify3}`,
    '    var sharedConsentDomains = [',
    list.map((d) => `      ${JSON.stringify(d)}`).join(',\n'),
    '    ];',
    '',
    `    // ${c.find}`,
    '    function findSharedDomain(hostname) {',
    '      return sharedConsentDomains.find(function (domain) {',
    '        return hostname === domain || hostname.endsWith("." + domain);',
    '      }) || null;',
    '    }',
    '',
    `    // ${c.outside}`,
    '    var currentDomain = findSharedDomain(window.location.hostname);',
    '    if (!currentDomain) {',
    '      return;',
    '    }',
    '',
    '    document.querySelectorAll("a[href]").forEach(function (link) {',
    '      var url;',
    '      try {',
    '        url = new URL(link.href);',
    '      } catch (e) {',
    `        return; // ${c.unreadable}`,
    '      }',
    `      // ${c.webOnly}`,
    '      if (url.protocol !== "http:" && url.protocol !== "https:") {',
    '        return;',
    '      }',
    `      // ${c.adds}`,
    '      var targetDomain = findSharedDomain(url.hostname);',
    '      if (targetDomain && targetDomain !== currentDomain) {',
    '        url.searchParams.set("axeptio_token", axeptio.getToken());',
    '        link.href = url.href;',
    '      }',
    '    });',
    '  });',
    '});',
    '<\/script>',
  ].join('\n');
}

function linkLanguages(s, ui) {
  const langs = siteLangs(s);
  return langs.length ? langs : [ui];
}

function linkLabel(s, lang) {
  const custom = s.linkLabels[lang];
  if (custom && custom.trim()) return custom.trim();
  return en.link.defaultLabels[lang] || en.link.defaultLabels.en;
}

function footerCode(s, t, ui) {
  const langs = linkLanguages(s, ui);
  const names = messagesFor(ui).common.languages;
  const csp = s.csp && s.nonce.trim();
  const lines = [`<\!-- ${t.code.footer} -->`];
  for (const lang of langs) {
    if (langs.length > 1) lines.push(`<\!-- ${t.code.footerLang(names[lang] || lang.toUpperCase())} -->`);
    const label = escapeHtml(linkLabel(s, lang));
    lines.push(
      csp
        ? `<a href="#" class="axeptio-reopen">${label}</a>`
        : `<a href="#" onclick="if (window.openAxeptioCookies) { window.openAxeptioCookies(); } return false;">${label}</a>`,
    );
  }
  if (csp) {
    lines.push(scriptOpen(s));
    lines.push('document.addEventListener("click", function (event) {');
    lines.push('  var link = event.target.closest ? event.target.closest(".axeptio-reopen") : null;');
    lines.push('  if (link) {');
    lines.push('    event.preventDefault();');
    lines.push('    if (window.openAxeptioCookies) {');
    lines.push('      window.openAxeptioCookies();');
    lines.push('    }');
    lines.push('  }');
    lines.push('});');
    lines.push('<\/script>');
  }
  return lines.join('\n');
}

function preconnectCode(s, t) {
  return [
    `<\!-- ${t.code.preconnect} -->`,
    s.sdk === 'tcf' ? '<link rel="preconnect" href="https://static.axept.io" crossorigin>' : '<link rel="preconnect" href="https://static.axept.io">',
    '<link rel="preconnect" href="https://client.axept.io" crossorigin>',
  ].join('\n');
}

function gcmInlineCode(s, t) {
  const dl = dataLayerOf(s);
  const ref = isIdentifier(dl) ? `window.${dl}` : `window[${jsString(dl, "'")}]`;
  const push = isIdentifier(dl) ? `${dl}.push` : `${ref}.push`;
  const lines = [scriptOpen(s), `// ${t.code.gcmInline}`, `${ref} = ${ref} || [];`, `function gtag(){${push}(arguments);}`];
  for (const entry of gcmEntries(s)) lines.push(`gtag('consent', 'default', ${inlineLiteral(entry, "'")});`);
  if (s.google.redaction) lines.push("gtag('set', 'ads_data_redaction', true);");
  if (s.google.passthrough) lines.push("gtag('set', 'url_passthrough', true);");
  lines.push('<\/script>');
  return lines.join('\n');
}

function axeptioCode(s, settings, t) {
  return [scriptOpen(s), settingsSource(settings.entries, s, t), '', LOADERS[s.sdk], '<\/script>'].join('\n');
}

// ---------------------------------------------------------------------------------------------
// State checks: what to fix before copying (shares rule IDs and copy with the audit)
// ---------------------------------------------------------------------------------------------

function finding(id, severity, data = {}) {
  return { id, severity, kind: data.kind || null, data };
}

function checkState(input) {
  const s = normalizeState(input);
  const out = [];
  const p = s.project;
  const host = siteHost(s);
  if (!PROJECT_ID_RE.test(s.projectId)) out.push(finding('N1', 'warning', { kind: 'id' }));
  if (s.subdomains) {
    const info = cookieDomainInfo(s);
    if (!info.value) out.push(finding('N1', 'warning', { kind: 'domain' }));
    else if (host && !domainCovers(info.value, host)) out.push(finding('A6', 'error', { kind: 'domainHost', value: info.value, host, fixed: registrableDomain(host).domain || host }));
  }
  for (const v of s.vendors) if (v.on && !v.code.trim()) out.push(finding('N1', 'warning', { kind: 'vendorCode', name: v.name, title: v.title || v.name }));
  if (s.csp && !s.nonce.trim()) out.push(finding('N1', 'warning', { kind: 'nonce' }));
  if (s.google.on) {
    const entries = [s.google.optout, ...s.google.extra];
    for (const e of entries) {
      for (const code of e.region) {
        const r = checkRegionCode(code);
        if (!r.ok) out.push(finding('G4', 'warning', { kind: 'region', code, issue: r.issue, fixed: r.fixed }));
      }
    }
  }
  if (p) {
    const configs = projectConfigs(s);
    if (s.google.on && s.sdk === 'brands' && configs.length) {
      const without = configs.filter((c) => !c.gcm).map((c) => c.name);
      if (without.length === configs.length) out.push(finding('G1', 'error', { partial: false, names: without }));
      else if (without.length) out.push(finding('G1', 'warning', { partial: true, names: without }));
    }
    if (p.restriction && host && !p.domains.some((d) => domainCovers(d, host))) {
      out.push(finding('P1', 'error', { domain: host, domains: p.domains }));
    }
    if (s.sdk === 'brands' && !p.geo && p.configs.length > 1 && s.pin === 'none') {
      out.push(finding('P2', 'warning', { count: p.configs.length, first: p.configs[0].name }));
    }
    if (s.pin === 'config' && s.pinConfig.trim() && !configs.some((c) => c.name === s.pinConfig.trim())) {
      out.push(finding('A1', 'warning', { value: s.pinConfig.trim(), noMatch: s.pinConfig.trim() }));
    }
  }
  return out;
}

// ---------------------------------------------------------------------------------------------
// generate(state, { ui }) → blocks, head/footer code, guide
// ---------------------------------------------------------------------------------------------

function generate(input, opts = {}) {
  const ui = opts.ui === 'fr' ? 'fr' : 'en';
  const t = messagesFor(ui);
  const s = normalizeState(input);
  const owner = gcmOwner(s);
  const settings = effectiveSettings(s);
  const blocks = [];
  if (s.preconnect) blocks.push({ id: 'preconnect', where: 'head', code: preconnectCode(s, t) });
  if (owner === 'inline') blocks.push({ id: 'gcm', where: 'head', code: gcmInlineCode(s, t) });
  blocks.push({ id: 'axeptio', where: 'head', code: axeptioCode(s, settings, t) });
  const callbacks = callbacksCode(s, t);
  if (callbacks) blocks.push({ id: 'callbacks', where: 'head', code: callbacks });
  const cross = crossDomainInfo(s);
  if (s.sdk === 'brands' && s.crossDomain && cross.list.length) blocks.push({ id: 'crossDomain', where: 'head', code: crossDomainCode(cross.list, s, t) });
  const hideOn = s.hideButton && s.sdk === 'brands';
  if (s.link || hideOn) blocks.push({ id: 'footer', where: 'footer', code: footerCode(s, t, ui) });
  const head = blocks.filter((b) => b.where === 'head').map((b) => b.code).join('\n\n');
  const footer = blocks.filter((b) => b.where === 'footer').map((b) => b.code).join('\n\n');
  if (opts.nested) return { ui, blocks, head, footer };
  const checks = checkState(s);
  return { ui, blocks, head, footer, settings: settings.object, entries: settings.entries, dropped: settings.dropped, checks, guide: buildGuide(s, { blocks, settings, owner, cross, ui }) };
}

function buildGuide(s, ctx) {
  const t = messagesFor(ctx.ui);
  const has = (id) => ctx.blocks.some((b) => b.id === id);
  const steps = [];
  const vendorsOn = s.vendors.filter((v) => v.on);
  if (has('preconnect')) steps.push(t.guide.step.preconnect);
  if (ctx.owner === 'inline') {
    steps.push(t.guide.step.gcmFirst, t.guide.step.axeptioAfterGcm);
  } else if (s.google.on) {
    steps.push(s.google.loading === 'gtm' ? t.guide.step.axeptioGtm : t.guide.step.axeptioGoogle);
  } else {
    steps.push(t.guide.step.axeptio);
  }
  if (s.sdk === 'tcf') steps.push(t.guide.step.tcfEarly);
  if (has('callbacks') && vendorsOn.length) {
    steps.push(t.guide.step.callbacks);
    steps.push(t.guide.step.removeTags(t.list(vendorsOn.map((v) => v.title || v.name))));
  } else if (has('callbacks')) {
    steps.push(t.guide.step.callbacks);
  }
  if (has('crossDomain')) steps.push(t.guide.step.crossDomain(t.list(ctx.cross.list)));
  if (has('footer')) steps.push(t.guide.step.footer);
  steps.push(t.guide.step.once);
  if (s.google.on && s.sdk === 'brands') steps.push(t.guide.step.gcmStep);

  const why = [];
  why.push({ code: s.sdk === 'tcf' ? 'tcf/sdk.js' : 'sdk.js', text: s.sdk === 'tcf' ? t.guide.snippetWhy.loaderTcf : t.guide.snippetWhy.loader });
  for (const e of ctx.settings.entries) {
    const text = e.src === 'custom' ? t.expert.customNotRead(SDK_BUILD) : t.keys[e.key];
    if (text) why.push({ code: e.key, text });
  }
  if (has('gcm')) why.push({ code: "gtag('consent', 'default', …)", text: t.guide.snippetWhy.gcmInline });
  if (has('preconnect')) why.push({ code: 'preconnect', text: s.sdk === 'tcf' ? t.guide.snippetWhy.preconnectTcf : t.guide.snippetWhy.preconnect });
  if (vendorsOn.length) why.push({ code: 'cookies:complete', text: t.guide.snippetWhy.callbacks });
  if (s.hideButton && s.sdk === 'brands') why.push({ code: 'hideAxeptioButton()', text: t.guide.snippetWhy.hideButton });
  if (has('crossDomain')) why.push({ code: 'sharedConsentDomains', text: t.guide.snippetWhy.crossDomain });
  if (has('footer')) why.push({ code: 'openAxeptioCookies()', text: t.guide.snippetWhy.footer });

  const notes = [];
  if (s.google.on) {
    if (s.sdk === 'brands') notes.push({ kind: 'warning', text: t.guide.note.gcmStep });
    notes.push({ kind: 'info', text: t.guide.note.allFour });
    if (gcmEntries(s).length > 1) notes.push({ kind: 'info', text: t.guide.note.regions });
  }
  if (vendorsOn.length) {
    notes.push({ kind: 'info', text: t.guide.note.revocation });
    if (s.google.on && s.google.loading === 'gtm' && s.sdk === 'brands') {
      notes.push({ kind: 'info', text: t.vendors.gtmRoute(t.list(vendorsOn.map((v) => `axeptio_activate_${v.name}`))) });
    }
  }
  if (s.sdk === 'tcf') {
    notes.push({ kind: 'info', text: t.guide.note.tcfVendors });
    if (has('callbacks')) notes.push({ kind: 'info', text: t.guide.note.tcfReplay });
    if (s.crossDomain) notes.push({ kind: 'warning', text: t.domains.crossTcf });
  }
  if (s.hideButton && s.sdk === 'brands') notes.push({ kind: 'info', text: t.guide.note.hideButton });
  if (s.project && s.sdk === 'brands' && s.project.configs.some((c) => OPT_OUT_REGULATIONS.has(c.reg))) notes.push({ kind: 'info', text: t.guide.note.gpp });
  if (ctx.settings.dropped.length) notes.push({ kind: 'warning', text: t.guide.note.dropped(ctx.settings.dropped.join(', ')) });
  notes.push({ kind: 'info', text: t.guide.step.everywhere });
  if (s.project) notes.push({ kind: 'info', text: t.guide.note.atlas, link: ATLAS_URL(s.project.id, languageDecision(s).value) });

  let crossDomain = null;
  if (has('crossDomain')) {
    const perDomain = s.subdomains
      ? ctx.cross.list.map((domain) => ({ domain, code: generateFor(s, domain, ctx.ui) }))
      : null;
    crossDomain = { constraints: t.guide.note.crossDomain, domains: ctx.cross.list, perDomain, sameCode: t.guide.note.sameCode };
  }
  return {
    steps,
    why,
    notes,
    gcmModes: s.google.on ? { head: t.guide.gcmModes.head, rows: t.guide.gcmModes.rows, chosen: t.guide.gcmModes.chosen(s.google.mode === 'basic' ? t.google.modeBasic : t.google.modeAdvanced) } : null,
    crossDomain,
  };
}

/** The same snippet for another site of the cross-domain list (its own userCookiesDomain). */
function generateFor(s, domain, ui) {
  const copy = clone(s);
  copy.cookieDomain = domain;
  copy.siteUrl = `https://${domain}`;
  const out = generate(copy, { ui, nested: true });
  return [out.head, out.footer].filter(Boolean).join('\n\n');
}

// ---------------------------------------------------------------------------------------------
// Tolerant JS tokenizer (never executes anything: no eval, no Function)
// ---------------------------------------------------------------------------------------------

const PUNCTUATORS = [
  '>>>=', '...', '===', '!==', '**=', '<<=', '>>=', '>>>', '&&=', '||=', '??=',
  '=>', '==', '!=', '<=', '>=', '&&', '||', '??', '?.', '++', '--', '+=', '-=', '*=', '/=', '%=', '&=', '|=', '^=', '**', '<<', '>>',
];
const REGEX_AFTER_KEYWORDS = new Set(['return', 'typeof', 'case', 'do', 'else', 'in', 'instanceof', 'new', 'delete', 'void', 'throw', 'yield', 'await']);

function decodeJsString(body) {
  return body.replace(/\\(u\{([0-9a-fA-F]+)\}|u([0-9a-fA-F]{4})|x([0-9a-fA-F]{2})|\r\n|[\s\S])/g, (all, esc, cp, u4, x2) => {
    if (cp) return String.fromCodePoint(parseInt(cp, 16));
    if (u4) return String.fromCharCode(parseInt(u4, 16));
    if (x2) return String.fromCharCode(parseInt(x2, 16));
    const map = { n: '\n', t: '\t', r: '\r', b: '\b', f: '\f', v: '\v', 0: '\0', '\n': '', '\r\n': '' };
    return Object.prototype.hasOwnProperty.call(map, esc) ? map[esc] : esc;
  });
}

function tokenize(code) {
  const tokens = [];
  const n = code.length;
  let i = 0;
  let last = null;
  const push = (type, start, end, value) => {
    const tok = { type, start, end, value: value === undefined ? code.slice(start, end) : value };
    tokens.push(tok);
    if (type !== 'comment') last = tok;
  };
  const regexAllowed = () =>
    !last ||
    (last.type === 'punct' && ![')', ']'].includes(last.value)) ||
    (last.type === 'ident' && REGEX_AFTER_KEYWORDS.has(last.value));
  while (i < n) {
    const ch = code[i];
    if (ch === ' ' || ch === '\t' || ch === '\n' || ch === '\r' || ch === '\f' || ch === '\v' || ch === ' ' || ch === '﻿') {
      i++;
      continue;
    }

      i = j;
      continue;

      let j = i + 1;
      let inClass = false;
      while (j < n && code[j] !== '\n') {

          continue;
        }

      j++;

      i = Math.min(j, n);
      continue;

    const len = p ? p.length : 1;
    push('punct', i, i + len);
    i += len;
  }
