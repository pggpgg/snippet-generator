}

const sig = (tokens) => tokens.filter((t) => t.type !== 'comment');
const isP = (t, v) => Boolean(t && t.type === 'punct' && t.value === v);
const isId = (t, v) => Boolean(t && t.type === 'ident' && (v === undefined || t.value === v));

/** End index (exclusive) of a bracketed group starting at toks[i] (an opening bracket). */
function matchBracket(toks, i) {
  const open = toks[i].value;
  const close = { '(': ')', '[': ']', '{': '}' }[open];
  let depth = 0;
  for (let j = i; j < toks.length; j++) {
    if (toks[j].type !== 'punct') continue;
    if (['(', '[', '{'].includes(toks[j].value)) depth++;
    else if ([')', ']', '}'].includes(toks[j].value)) {
      depth--;
      if (depth === 0) return toks[j].value === close ? j + 1 : j + 1;
    }
  }
  return toks.length;
}

/** A raw expression up to the next , ; ) ] } at depth 0: kept as text, marked dynamic. */
function rawExpressionAt(toks, i, code) {
  let depth = 0;
  let j = i;
  for (; j < toks.length; j++) {
    const t = toks[j];
    if (t.type !== 'punct') continue;
    if (['(', '[', '{'].includes(t.value)) depth++;
    else if ([')', ']', '}'].includes(t.value)) {
      if (depth === 0) break;
      depth--;
    } else if (depth === 0 && (t.value === ',' || t.value === ';')) break;
  }
  if (j === i) return { value: undefined, next: i + 1, error: `unexpected ${toks[i] ? toks[i].value : 'end'}` };
  return { value: { $raw: code.slice(toks[i].start, toks[j - 1].end) }, next: j, dynamic: true };
}

function parseValueAt(toks, i, code) {
  const t = toks[i];
  if (!t) return { value: undefined, next: i, error: 'end' };
  if (isP(t, '{')) return parseObjectAt(toks, i, code);
  if (isP(t, '[')) return parseArrayAt(toks, i, code);
  const end = toks[i + 1];
  const simpleEnd = !end || (end.type === 'punct' && [',', '}', ']', ')', ';'].includes(end.value));
  if (t.type === 'string' && simpleEnd) return { value: t.value, next: i + 1 };
  if (t.type === 'template' && t.value !== null && simpleEnd) return { value: t.value, next: i + 1 };
  if (t.type === 'number' && simpleEnd) {
    const num = Number(t.value.replace(/_/g, '').replace(/n$/, ''));
    return Number.isFinite(num) ? { value: num, next: i + 1 } : rawExpressionAt(toks, i, code);
  }
  if ((isP(t, '-') || isP(t, '+')) && toks[i + 1] && toks[i + 1].type === 'number') {
    const after = toks[i + 2];
    if (!after || (after.type === 'punct' && [',', '}', ']', ')', ';'].includes(after.value))) {
      const num = Number(toks[i + 1].value.replace(/_/g, ''));
      return { value: t.value === '-' ? -num : num, next: i + 2 };
    }
  }
  if (t.type === 'ident' && simpleEnd) {
    if (t.value === 'true') return { value: true, next: i + 1 };
    if (t.value === 'false') return { value: false, next: i + 1 };
    if (t.value === 'null') return { value: null, next: i + 1 };
    if (t.value === 'undefined') return { value: undefined, next: i + 1, undef: true };
  }
  return rawExpressionAt(toks, i, code);
}

function parseObjectAt(toks, i, code) {
  const value = {};
  const keyPos = {};
  const errors = [];
  let j = i + 1;
  while (j < toks.length) {
    const t = toks[j];
    if (isP(t, '}')) return { value, keyPos, errors, next: j + 1 };
    if (isP(t, ',')) {
      j++;
      continue;
    }
    if (isP(t, '...')) {
      const r = rawExpressionAt(toks, j + 1, code);
      errors.push('spread');
      j = r.next;
      continue;
    }
    let key;
    let keyTok = t;
    if (t.type === 'ident' || t.type === 'string' || t.type === 'number') {
      key = String(t.value);
      j++;
    } else if (isP(t, '[')) {
      const end = matchBracket(toks, j);
      key = code.slice(t.start, toks[end - 1].end);
      errors.push('computed');
      j = end;
    } else {
      errors.push(`unexpected ${t.value}`);
      j++;
      continue;
    }
    const next = toks[j];
    if (isP(next, ':')) {
      const r = parseValueAt(toks, j + 1, code);
      if (r.error) errors.push(r.error);
      if (r.value !== undefined || r.undef) value[key] = r.value;
      keyPos[key] = keyTok.start;
      j = Math.max(r.next, j + 1);
    } else if (isP(next, '(')) {
      const r = rawExpressionAt(toks, j, code);
      value[key] = { $raw: `function ${code.slice(next.start, toks[r.next - 1].end)}` };
      keyPos[key] = keyTok.start;
      j = r.next;
    } else {
      value[key] = { $raw: key };
      keyPos[key] = keyTok.start;
    }
  }
  errors.push('unclosed');
  return { value, keyPos, errors, next: j };
}

function parseArrayAt(toks, i, code) {
  const value = [];
  const errors = [];
  let j = i + 1;
  while (j < toks.length) {
    const t = toks[j];
    if (isP(t, ']')) return { value, errors, next: j + 1 };
    if (isP(t, ',')) {
      j++;
      continue;
    }
    const r = parseValueAt(toks, j, code);
    if (r.error) errors.push(r.error);
    if (r.value !== undefined) value.push(r.value);
    if (r.errors) errors.push(...r.errors);
    j = Math.max(r.next, j + 1);
  }
  errors.push('unclosed');
  return { value, errors, next: j };
}

/** Parses one JS literal (custom values, the raw settings editor). { ok, value, errors } */
function parseLiteral(text) {
  const code = str(text).trim().replace(/;\s*$/, '');
  const toks = sig(tokenize(code));
  if (!toks.length) return { ok: false, value: undefined, errors: ['empty'] };
  let start = 0;
  // Accept "window.axeptioSettings = { … }" and "axeptioSettings = { … }" too.
  const eq = toks.findIndex((t) => isP(t, '='));
  if (eq > 0 && toks.slice(0, eq).every((t) => t.type === 'ident' || isP(t, '.')) && toks.slice(0, eq).some((t) => isId(t, 'axeptioSettings'))) start = eq + 1;
  const r = parseValueAt(toks, start, code);
  const errors = [...(r.errors || []), ...(r.error ? [r.error] : [])];
  const rest = toks.slice(r.next).filter((t) => !isP(t, ';'));
  if (rest.length) errors.push('trailing');
  return { ok: !errors.length || errors.every((e) => e === 'computed' || e === 'spread'), value: r.value, errors };
}

/** Names declared at the top level of a script (function, var, let, const, class). */
function topLevelDeclarations(code) {
  const toks = sig(tokenize(code));
  const names = [];
  let depth = 0;
  for (let i = 0; i < toks.length; i++) {
    const t = toks[i];
    if (t.type === 'punct') {
      if (['(', '[', '{'].includes(t.value)) depth++;
      else if ([')', ']', '}'].includes(t.value)) depth = Math.max(0, depth - 1);
      continue;
    }
    if (depth !== 0 || t.type !== 'ident') continue;
    const prev = toks[i - 1];
    const startOfStatement = !prev || isP(prev, ';') || isP(prev, '}') || isP(prev, ')');
    if ((t.value === 'function' || t.value === 'class') && startOfStatement && isId(toks[i + 1])) {
      if (t.value === 'function' && isP(toks[i + 1], '*')) continue;
      names.push(toks[i + 1].value);
    } else if (['var', 'let', 'const'].includes(t.value) && startOfStatement) {
      let j = i + 1;
      let d = 0;
      let expectName = true;
      for (; j < toks.length; j++) {
        const u = toks[j];
        if (u.type === 'punct') {
          if (['(', '[', '{'].includes(u.value)) d++;
          else if ([')', ']', '}'].includes(u.value)) {
            if (d === 0) break;
            d--;
          } else if (d === 0 && u.value === ',') {
            expectName = true;
            continue;
          } else if (d === 0 && u.value === ';') break;
        }
        if (expectName && d === 0 && isId(u)) names.push(u.value);
        expectName = false;
      }
    }
  }
  return uniq(names.filter((n) => isIdentifier(n) && !['undefined', 'window', 'document'].includes(n)));
}

// ---------------------------------------------------------------------------------------------
// HTML: script and link extraction (regex-level, like the browser's own <script> scanning)
// ---------------------------------------------------------------------------------------------

function parseAttributes(text) {
  const attrs = {};
  const re = /([^\s"'=<>/]+)(?:\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s"'>]+)))?/g;
  let m;
  while ((m = re.exec(text || ''))) {
    const name = m[1].toLowerCase();
    attrs[name] = m[2] !== undefined ? m[2] : m[3] !== undefined ? m[3] : m[4] !== undefined ? m[4] : '';
  }
  return attrs;
}

function extractScripts(text) {
  const scripts = [];
  if (!/<script\b/i.test(text)) {
    if (text.trim() && !/^\s*</.test(text)) scripts.push({ start: 0, end: text.length, codeStart: 0, attrs: {}, src: null, code: text, outer: text, bare: true });
    return scripts;
  }
  const re = /<script\b([^>]*)>([\s\S]*?)(<\/script\s*>|$)/gi;
  let m;
  while ((m = re.exec(text))) {
    const attrs = parseAttributes(m[1]);
    const openLen = m[0].length - m[2].length - m[3].length;
    scripts.push({ start: m.index, end: m.index + m[0].length, codeStart: m.index + openLen, attrs, src: attrs.src || null, code: m[2], outer: m[0], bare: false });
    if (!m[3]) break;
  }
  return scripts;
}

const AXEPTIO_SRC_RE = /axept\.io\/(tcf\/sdk|sdk-slim|sdk)\.js/i;
const loaderKind = (url) => {
  const m = AXEPTIO_SRC_RE.exec(url || '');
  return m ? (m[1].toLowerCase() === 'tcf/sdk' ? 'tcf' : m[1].toLowerCase() === 'sdk-slim' ? 'slim' : 'brands') : null;
};
const googleKind = (url) => (/googletagmanager\.com\/gtag\/js/i.test(url) ? 'gtagjs' : /googletagmanager\.com\/gtm\.js/i.test(url) ? 'gtm' : null);

/**
 * Reads a pasted snippet without running it.
 * Positions are character offsets in the pasted text, so "before" means "earlier in the page".
 */
function parse(text) {
  const src = str(text);
  const out = {
    scripts: [],
    loaders: [],
    google: [],
    assignments: [],
    props: [],
    gtag: { configs: [], defaults: [], sets: [] },
    crossDomain: [],
    callbacks: [],
    reopen: [],
    preconnect: [],
    nonces: [],
    errors: [],
    merged: {},
    mergedPos: {},
  };
  out.scripts = extractScripts(src);
  out.scripts.forEach((sc, index) => {
    sc.index = index;
    if (sc.attrs.nonce) out.nonces.push(sc.attrs.nonce);
    if (sc.src) {
      const kind = loaderKind(sc.src);
      if (kind) {
        out.loaders.push({ kind, module: (sc.attrs.type || '').toLowerCase() === 'module', external: true, pos: sc.start, script: index, attrs: sc.attrs });
      }
      const g = googleKind(sc.src);

      return;

  const outside = src.replace(/<script\b[^>]*>[\s\S]*?(<\/script\s*>|$)/gi, (m) => ' '.repeat(m.length));
  const aRe = /<a\b[^>]*>[\s\S]*?<\/a\s*>/gi;
  let m;
  while ((m = aRe.exec(outside))) if (/openAxeptioCookies/.test(m[0])) out.reopen.push({ start: m.index, end: m.index + m[0].length });

  while ((m = linkRe.exec(outside))) {
    const attrs = parseAttributes(m[0].slice(5, -1));
    if (/preconnect|dns-prefetch/i.test(attrs.rel || '') && /axept\.io/i.test(attrs.href || '')) out.preconnect.push({ start: m.index, end: m.index + m[0].length, href: attrs.href });
  }

  // assignments, then data-* attributes of a <script data-id src="…axept.io…"> tag.
  const events = [...out.assignments.map((a) => ({ pos: a.pos, a })), ...out.props.map((p) => ({ pos: p.pos, p }))].sort((x, y) => x.pos - y.pos);

    if (e.a) {
      out.merged = { ...e.a.object };
      out.mergedPos = Object.fromEntries(Object.keys(e.a.object).map((k) => [k, e.a.keyPos[k] ?? e.a.pos]));
    } else {
      out.merged[e.p.key] = e.p.value;
      out.mergedPos[e.p.key] = e.p.pos;
    }

    for (const [attr, key] of Object.entries(map)) if (tag.attrs[attr]) out.merged[key] = tag.attrs[attr];
  }

}

function analyzeInline(sc, index, out) {
  const all = tokenize(sc.code);
  const toks = sig(all);
  const at = (t) => sc.codeStart + t.start;
  const moduleType = toks.some(
    (t, i) =>
      t.type === 'string' &&
      t.value === 'module' &&
      ((isP(toks[i - 1], '=') && isId(toks[i - 2], 'type')) || (isP(toks[i - 1], ':') && isId(toks[i - 2], 'type')) || (isP(toks[i - 1], ',') && toks[i - 2] && toks[i - 2].type === 'string' && toks[i - 2].value === 'type')),
  );
  for (let i = 0; i < toks.length; i++) {
    const t = toks[i];
    if (t.type === 'string' || (t.type === 'template' && t.value)) {
      const kind = loaderKind(t.value);
      if (kind) out.loaders.push({ kind, module: moduleType, external: false, pos: at(t), script: index });
      if (/googletagmanager\.com\/gtm\.js/i.test(t.value)) out.google.push({ kind: 'gtm', pos: at(t), script: index });
      else if (/googletagmanager\.com\/gtag\/js/i.test(t.value)) out.google.push({ kind: 'gtagjs', pos: at(t), script: index });
    }
    if (!isId(t)) continue;
    if (t.value === 'axeptioSettings') {
      const prev = toks[i - 1];
      const prev2 = toks[i - 2];
      const ownerOk =
        !prev ||
        isP(prev, ';') ||
        isP(prev, '}') ||
        isP(prev, '{') ||
        ['var', 'let', 'const'].includes(prev.value) ||
        (isP(prev, '.') && ['window', 'self', 'globalThis', 'top', 'parent'].includes(prev2 && prev2.value));
      const next = toks[i + 1];
      if (ownerOk && isP(next, '=') && isP(toks[i + 2], '{')) {
        const r = parseObjectAt(toks, i + 2, sc.code);
        const keyPos = Object.fromEntries(Object.entries(r.keyPos).map(([k, p]) => [k, sc.codeStart + p]));
        out.assignments.push({ object: r.value, keyPos, pos: at(t), script: index, errors: r.errors });
        if (r.errors.includes('unclosed')) out.errors.push({ pos: at(t), message: 'unclosed' });
        i = r.next - 1;
        continue;
      }
      if (ownerOk && (isP(next, '.') || isP(next, '['))) {
        let key = null;
        let k = i + 2;
        if (isP(next, '.') && isId(toks[i + 2])) {
          key = toks[i + 2].value;
          k = i + 3;
        } else if (isP(next, '[') && toks[i + 2] && toks[i + 2].type === 'string' && isP(toks[i + 3], ']')) {
          key = toks[i + 2].value;
          k = i + 4;
        }
        if (key && isP(toks[k], '=') && !isP(toks[k + 1], '=')) {
          const r = parseValueAt(toks, k + 1, sc.code);
          out.props.push({ key, value: r.value, pos: at(toks[i + 2]), script: index });
          i = r.next - 1;
        }
      }
      continue;
    }
    if (t.value === 'gtag' && isP(toks[i + 1], '(') && toks[i + 2] && toks[i + 2].type === 'string' && !isId(toks[i - 1], 'function')) {
      const end = matchBracket(toks, i + 1);
      const stmtEnd = isP(toks[end], ';') ? toks[end].end : toks[end - 1].end;
      const call = { pos: at(t), script: index, start: sc.codeStart + t.start, end: sc.codeStart + stmtEnd };
      const cmd = toks[i + 2].value;
      if (cmd === 'config') out.gtag.configs.push({ ...call, id: toks[i + 4] && toks[i + 4].type === 'string' ? toks[i + 4].value : '' });
      else if (cmd === 'consent' && toks[i + 4] && toks[i + 4].type === 'string' && toks[i + 4].value === 'default' && isP(toks[i + 6], '{')) {
        const r = parseObjectAt(toks, i + 6, sc.code);
        out.gtag.defaults.push({ ...call, entry: r.value });
      } else if (cmd === 'set' && toks[i + 4] && toks[i + 4].type === 'string') {
        const r = parseValueAt(toks, i + 6, sc.code);

      }
      i = end - 1;
      continue;
    }
    if (t.value === 'sharedConsentDomains' && isP(toks[i + 1], '=') && isP(toks[i + 2], '[')) {
      const r = parseArrayAt(toks, i + 2, sc.code);
      out.crossDomain.push({ list: r.value.filter((x) => typeof x === 'string'), pos: at(t), script: index });
      i = r.next - 1;
      continue;
    }
    if (t.value === '_axcb' && isP(toks[i + 1], '.') && isId(toks[i + 2], 'push')) {
      out.callbacks.push({ pos: at(t), script: index });
    }

  }
}

const SEVERITY_ORDER = { error: 0, warning: 1, info: 2 };

function gcmEntriesFromSettings(gcm) {
  if (!isObj(gcm) || gcm.default === undefined) return null;
  if (Array.isArray(gcm.default)) return gcm.default;
  if (isObj(gcm.default)) return [gcm.default];
  return [];
}

function auditEntries(entries, findings, origin) {
  if (!entries) return;
  let hasFallback = false;
  for (const e of entries) {
    if (!isObj(e) || isRaw(e)) continue;
    if (!('region' in e)) hasFallback = true;
    for (const [k, v] of Object.entries(e)) {
      if (GCM_ALL_TYPES.includes(k)) {
        if (v !== 'granted' && v !== 'denied') findings.push(finding('G4', 'error', { kind: 'value', type: k, value: isRaw(v) ? v.$raw : String(v) }));
      } else if (k === 'region') {
        if (!Array.isArray(v)) {
          findings.push(finding('G4', 'error', { kind: 'regionType', codes: typeof v === 'string' ? v.split(/[\s,]+/).filter(Boolean) : [] }));
        } else {
          for (const code of v) {
            const r = checkRegionCode(code);
            if (!r.ok) findings.push(finding('G4', 'warning', { kind: 'region', code: String(code), issue: r.issue, fixed: r.fixed }));
          }
        }
      } else if (k === 'wait_for_update') {
        if (typeof v !== 'number' && !(typeof v === 'string' && /^\d+$/.test(v))) findings.push(finding('G4', 'warning', { kind: 'wait' }));
      } else {
        const suggestion = GCM_ALL_TYPES.find((type) => levenshtein(k.toLowerCase(), type) <= 2) || null;
        findings.push(finding('G4', 'warning', { kind: 'type', type: k, suggestion }));
      }
    }
    if (origin === 'settings') {
      const missing = GCM_TYPES.filter((type) => !(type in e));
      if (missing.length) findings.push(finding('G4', 'info', { kind: 'partial', types: missing }));
    }
  }
  if (entries.length && !hasFallback) findings.push(finding('G4', 'warning', { kind: 'noFallback' }));
}

/**
 * audit(text, { project, siteUrl, sdk, ui }) → { findings, parsed, sdk }
 * Each finding: { id, severity, kind, data, title, why, fix }.
 */
function audit(text, ctx = {}) {
  const parsed = parse(text);
  const findings = [];
  const ui = ctx.ui === 'fr' ? 'fr' : 'en';
  const project = normalizeProject(ctx.project);
  const host = hostFromUrl(ctx.siteUrl);
  const empty = !str(text).trim();
  const loaders = parsed.loaders;
  const sdk = loaders.some((l) => l.kind === 'tcf') ? 'tcf' : loaders.length ? 'brands' : ctx.sdk === 'tcf' ? 'tcf' : 'brands';
  const s = parsed.merged;

  if (!empty && !loaders.length) findings.push(finding('N1', 'info', { kind: 'noLoader' }));
  for (const err of parsed.errors) findings.push(finding('N1', 'warning', { kind: 'parse', message: err.message === 'unclosed' ? null : err.message }));
  if (loaders.some((l) => l.external && l.attrs && l.attrs['data-id'] !== undefined)) findings.push(finding('N1', 'info', { kind: 'dataId' }));

  // A2: twice. A3: module type. A7: legacy URL.
  if (loaders.length > 1) {
    const name = (l) => (l.kind === 'tcf' ? 'tcf/sdk.js' : l.kind === 'slim' ? 'sdk-slim.js' : 'sdk.js');
    findings.push(finding('A2', 'error', { sources: loaders.map(name).join(' + ') }));
  }
  if (loaders.some((l) => l.kind === 'tcf' && !l.module)) findings.push(finding('A3', 'error', { kind: 'tcfNoModule' }));
  if (loaders.some((l) => l.kind !== 'tcf' && l.module)) findings.push(finding('A3', 'error', { kind: 'brandsModule' }));
  if (loaders.some((l) => l.kind === 'slim')) findings.push(finding('A7', 'info', {}));

  const hasSettings = parsed.assignments.length > 0 || parsed.props.length > 0 || Object.keys(s).length > 0;

  // A5: clientId.
  if (hasSettings || loaders.length) {
    const id = s.clientId !== undefined ? s.clientId : sdk === 'tcf' ? s.projectId : undefined;
    if (id === undefined) {
      if (sdk === 'brands' && s.projectId !== undefined) findings.push(finding('A5', 'error', { kind: 'projectId' }));
      else if (loaders.length) findings.push(finding('A5', 'error', { kind: 'missing' }));
    } else if (typeof id !== 'string') {
      findings.push(finding('A5', 'info', { kind: 'dynamic' }));
    } else if (!PROJECT_ID_RE.test(id.trim())) {
      findings.push(finding('A5', 'error', { kind: 'invalid', value: id }));
    } else if (project && project.id && project.id !== id.trim().toLowerCase()) {
      findings.push(finding('A5', 'warning', { kind: 'mismatch', value: id, project: project.id }));
    }
    if (sdk === 'brands' && s.clientId !== undefined && s.projectId !== undefined) findings.push(finding('A5', 'warning', { kind: 'projectId' }));
  }

  // A4: unknown, misspelled, internal or TCF-ignored keys.
  for (const key of Object.keys(s)) {
    if (key === 'clientId' || (key === 'projectId' && (sdk === 'tcf' || s.clientId === undefined))) continue;
    const entry = CATALOGUE_BY_KEY.get(key);
    if (SDK_INTERNAL_FIELDS.has(key)) {
      findings.push(finding('A4', 'warning', { kind: 'internal', key }));
    } else if (entry && (sdk === 'tcf' ? entry.tcf || entry.tcfOnly : !entry.tcfOnly)) {
      continue;
    } else if (entry && sdk === 'tcf') {
      findings.push(finding('A4', 'warning', { kind: 'tcf', key }));
    } else {
      const suggestion = suggestKey(key, sdk) || (sdk === 'tcf' ? suggestKey(key, 'brands') : null);
      if (suggestion) findings.push(finding('A4', 'warning', { kind: 'typo', key, suggestion }));
      else if (key !== 'projectId') findings.push(finding('A4', 'info', { kind: 'unknown', key }));
    }
  }

  // A6: bad values.
  if (typeof s.userCookiesDomain === 'string') {
    const c = cleanDomain(s.userCookiesDomain);
    const hard = c.issues.some((x) => ['protocol', 'path', 'port', 'invalid', 'space'].includes(x));
    if (c.issues.length) findings.push(finding('A6', hard ? 'error' : 'warning', { kind: 'domain', value: s.userCookiesDomain, fixed: c.fixed, issues: c.issues, severity: hard ? 'error' : 'warning' }));
    else if (host && !domainCovers(c.fixed, host)) findings.push(finding('A6', 'error', { kind: 'domainHost', value: s.userCookiesDomain, host, fixed: registrableDomain(host).domain || host }));
  }
  if (s.userCookiesSecure === false) findings.push(finding('A6', 'warning', { kind: 'secure' }));
  if ('triggerGTMEvents' in s && ![true, false, 'update_only'].includes(s.triggerGTMEvents) && !isRaw(s.triggerGTMEvents)) {
    findings.push(finding('A6', 'error', { kind: 'gtmEvents', value: String(s.triggerGTMEvents) }));
  }
  if ('userCookiesDuration' in s) {
    const v = s.userCookiesDuration;
    const ok = (typeof v === 'number' && v > 0) || (typeof v === 'string' && (/^\d+/.test(v.trim()) || v === 'page' || v === 'session')) || isRaw(v);
    if (!ok) findings.push(finding('A6', 'warning', { kind: 'duration', value: String(v) }));
  }
  if (typeof s.userCookiesSameSite === 'string') {
    if (!/^(lax|strict|none)$/i.test(s.userCookiesSameSite)) findings.push(finding('A6', 'warning', { kind: 'sameSite', value: s.userCookiesSameSite }));
    else if (/^none$/i.test(s.userCookiesSameSite) && s.userCookiesSecure === false) findings.push(finding('A6', 'warning', { kind: 'sameSiteNone' }));
  }

  // A1: cookiesVersion.
  if (s.cookiesVersion !== undefined) {
    const names = project ? (sdk === 'tcf' ? project.tcfConfigs : project.configs).map((c) => c.name) : null;
    const geo = project ? (sdk === 'tcf' ? project.tcfGeo : project.geo) : false;
    if (typeof s.cookiesVersion === 'string') {
      const noMatch = names && !names.includes(s.cookiesVersion) ? s.cookiesVersion : null;
      findings.push(finding('A1', noMatch && geo ? 'error' : 'warning', { value: s.cookiesVersion, noMatch }));
    } else {
      const type = isObj(s.cookiesVersion) && typeof s.cookiesVersion.type === 'string' ? s.cookiesVersion.type : 'custom_function';
      const cases = isObj(s.cookiesVersion) && isObj(s.cookiesVersion.cases) ? Object.values(s.cookiesVersion.cases).filter((v) => typeof v === 'string') : [];
      const noMatch = names ? cases.find((c) => !names.includes(c)) || null : null;
      findings.push(finding('A1', noMatch && geo ? 'error' : 'warning', { dynamic: type === 'browser_locale' ? 'browser_locale' : 'code', noMatch }));
    }
  }

  // Google Consent Mode.
  const settingsEntries = gcmEntriesFromSettings(s.googleConsentMode);
  const inlineDefaults = parsed.gtag.defaults;
  const gcmDeclared = Boolean((settingsEntries && settingsEntries.length) || (isObj(s.googleConsentMode) && s.googleConsentMode.display === true) || inlineDefaults.length);
  if (gcmDeclared && project && sdk === 'brands' && project.configs.length) {
    const without = project.configs.filter((c) => !c.gcm).map((c) => c.name);
    if (without.length === project.configs.length) findings.push(finding('G1', 'error', { partial: false, names: without }));
    else if (without.length) findings.push(finding('G1', 'warning', { partial: true, names: without }));
  }
  const firstLoader = loaders.length ? Math.min(...loaders.map((l) => l.pos)) : null;
  const firstGoogle = parsed.google.length ? parsed.google.reduce((a, b) => (b.pos < a.pos ? b : a)) : null;
  if (firstGoogle && firstLoader !== null && firstGoogle.pos < firstLoader) {
    findings.push(finding('G2', 'error', { kind: 'googleFirst', what: firstGoogle.kind === 'gtm' ? 'Google Tag Manager' : 'gtag.js' }));
  }
  const firstConfig = parsed.gtag.configs.length ? Math.min(...parsed.gtag.configs.map((c) => c.pos)) : null;
  if (firstConfig !== null) {
    const firstInlineDefault = inlineDefaults.length ? Math.min(...inlineDefaults.map((d) => d.pos)) : null;
    if (firstInlineDefault !== null) {
      if (firstConfig < firstInlineDefault) findings.push(finding('G2', 'error', { kind: 'configFirst' }));
    } else if (settingsEntries && settingsEntries.length) {
      findings.push(finding('G2', firstLoader === null || firstConfig < firstLoader ? 'error' : 'warning', { kind: firstLoader === null || firstConfig < firstLoader ? 'configFirst' : 'race' }));
    } else {
      findings.push(finding('G2', 'error', { kind: 'configFirst' }));
    }
  }
  if (inlineDefaults.length && settingsEntries && settingsEntries.length) findings.push(finding('G3', 'warning', {}));
  auditEntries(settingsEntries, findings, 'settings');
  auditEntries(inlineDefaults.length ? inlineDefaults.map((d) => d.entry) : null, findings, 'inline');
  if (isObj(s.googleConsentMode) && s.googleConsentMode.url_passthrough === false) findings.push(finding('G4', 'info', { kind: 'passthrough' }));

  // X1: cross-domain lists.
  const lists = parsed.crossDomain.map((c) => c.list);
  if (Array.isArray(s.userCrossCookiesDomain)) lists.push(s.userCrossCookiesDomain.filter((x) => typeof x === 'string'));
  for (const list of lists) {
    for (const d of list) {
      const c = cleanDomain(d);
      if (c.issues.length) findings.push(finding('X1', 'error', { kind: 'format', value: d, fixed: c.fixed }));
    }
  }
  if (parsed.crossDomain.length) {
    const cleaned = parsed.crossDomain.map((c) => c.list.map((d) => cleanDomain(d).fixed));
    if (host) {
      if (!cleaned[0].some((d) => domainCovers(d, host))) findings.push(finding('X1', 'error', { kind: 'missing', site: registrableDomain(host).domain || host }));
    } else {
      findings.push(finding('X1', 'info', { kind: 'unknown' }));
    }
    const key = (l) => [...l].sort().join(',');
    if (cleaned.length > 1 && cleaned.some((l) => key(l) !== key(cleaned[0]))) findings.push(finding('X1', 'error', { kind: 'differ' }));
  }

  // P1, P2: project-level.
  if (project) {
    if (project.restriction && host && !project.domains.some((d) => domainCovers(d, host))) findings.push(finding('P1', 'error', { domain: host, domains: project.domains }));
    if (sdk === 'brands' && !project.geo && project.configs.length > 1 && s.cookiesVersion === undefined) {
      findings.push(finding('P2', 'warning', { count: project.configs.length, first: project.configs[0].name }));
    }
  }

  // De-duplicate identical findings, sort by severity, attach the copy.
  const seen = new Set();
  const unique = findings.filter((f) => {
    const k = `${f.id}:${JSON.stringify(f.data)}`;
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  });
  unique.sort((a, b) => SEVERITY_ORDER[a.severity] - SEVERITY_ORDER[b.severity]);
  return { findings: unique.map((f) => withCopy(f, ui)), parsed, sdk };
}

function withCopy(f, ui) {
  const fn = messagesFor(ui).findings[f.id];
  const copy = fn ? fn(f.data) : null;
  return { ...f, title: copy ? copy.title : f.id, why: copy ? copy.why : '', fix: copy ? copy.fix : '' };
}

// ---------------------------------------------------------------------------------------------
// "Load into the wizard": state from a pasted snippet, and the corrected version of the paste
// ---------------------------------------------------------------------------------------------

function entriesToWizard(entries, origin, g) {
  const fill = origin === 'settings' ? 'denied' : 'granted';
  const values = (e) => Object.fromEntries(GCM_TYPES.map((type) => [type, e[type] === 'granted' || e[type] === 'denied' ? e[type] : fill]));
  const list = entries.filter((e) => isObj(e) && !isRaw(e));
  const fallback = list.find((e) => !('region' in e));
  if (fallback) {
    g.fallback = values(fallback);
    const wait = Number(fallback.wait_for_update);
    if (Number.isFinite(wait)) g.wait = wait;
  }
  const regional = list.filter((e) => 'region' in e);
  const regions = (e) => (Array.isArray(e.region) ? e.region : typeof e.region === 'string' ? e.region.split(/[\s,]+/) : []).map(String);
  const optIdx = regional.findIndex((e) => GCM_TYPES.every((type) => values(e)[type] === 'granted'));
  g.optout = optIdx >= 0 ? { region: regions(regional[optIdx]), values: values(regional[optIdx]) } : { region: [], values: valuesOf('granted') };
  g.extra = regional.filter((_, i) => i !== optIdx).map((e) => ({ region: regions(e), values: values(e) }));
}

/** fromSnippet(text, baseState) → { state, after, parsed } (after: the paste, corrected in place). */
function fromSnippet(text, base) {
  const src = str(text);
  const parsed = parse(src);
  const prev = normalizeState(base || defaultState());
  const s = defaultState();
  // Keep what the paste can't say: the project, the site, its languages, the share card.
  for (const k of ['projectId', 'project', 'siteUrl', 'langs', 'htmlLang', 'share', 'linkLabels']) s[k] = clone(prev[k]);
  s.vendors = prev.vendors.map((v) => ({ ...v, on: false }));
  s.google.mode = prev.google.mode;
  const m = parsed.merged;
  if (parsed.loaders.some((l) => l.kind === 'tcf')) s.sdk = 'tcf';
  else if (parsed.loaders.length) s.sdk = 'brands';
  else s.sdk = prev.sdk;
  const id = typeof m.clientId === 'string' ? m.clientId : typeof m.projectId === 'string' ? m.projectId : null;
  if (id && PROJECT_ID_RE.test(id.trim())) {
    s.projectId = id.trim().toLowerCase();
    if (s.project && s.project.id !== s.projectId) s.project = null;
  }

  const apply = (key, value) => {
    switch (key) {
      case 'clientId':
      case 'projectId':
        return;
      case 'cookiesVersion':
        if (typeof value === 'string') {
          s.pin = 'config';
          s.pinConfig = value;
        } else if (isObj(value) && isObj(value.cases) && (value.type === 'browser_locale' || /documentElement\.lang/.test(JSON.stringify(value.config || '')))) {
          s.pin = value.type === 'browser_locale' ? 'browser' : 'page';
          s.pinCases = Object.entries(value.cases)
            .filter(([k, v]) => k !== 'default' && typeof v === 'string')
            .map(([lang, config]) => ({ lang, config }));
          s.pinDefault = typeof value.cases.default === 'string' ? value.cases.default : '';
        } else {
          s.expert.set.cookiesVersion = value;
        }
        return;
      case 'useDocumentLang':
        if (value === true) s.langLogic = 'page';
        else if (value === false) s.langLogic = 'browser';
        return;
      case 'userCookiesDomain':
        if (typeof value === 'string') {
          s.subdomains = true;
          s.cookieDomain = cleanDomain(value).fixed || value;
        }
        return;
      case 'userCookiesDuration':
        s.duration = String(isRaw(value) ? '' : value);
        return;
      case 'userCookiesSecure':
        if (value === false) s.secure = false;
        return;
      case 'userCookiesSameSite':
        if (typeof value === 'string' && /^(lax|strict|none)$/i.test(value)) s.sameSite = value[0].toUpperCase() + value.slice(1).toLowerCase();
        return;
      case 'triggerGTMEvents':
        if (value === false || value === 'false') s.gtmEvents = 'false';
        else if (value === 'update_only') s.gtmEvents = 'update_only';
        return;
      case 'dataLayerName':
        if (typeof value === 'string') s.dataLayerName = value;
        return;
      case 'openCookiesWidgetIfVendorsMismatch':
        if (value === true) s.vendorsMismatch = true;
        return;
      case 'nonce':
        if (typeof value === 'string') {
          s.csp = true;
          s.nonce = value;
        }
        return;
      case 'googleConsentMode':
        return;
      case 'userCrossCookiesDomain':
        if (s.sdk === 'tcf' && Array.isArray(value)) {
          s.crossDomain = true;
          s.crossDomains = value.filter((x) => typeof x === 'string').map((d) => cleanDomain(d).fixed || d);
        } else {
          s.expert.set.userCrossCookiesDomain = value;
        }
        return;
      default:
        if (SDK_INTERNAL_FIELDS.has(key)) return;
        if (CATALOGUE_BY_KEY.has(key)) {
          const c = CATALOGUE_BY_KEY.get(key);
          if (s.sdk === 'tcf' ? c.tcf || c.tcfOnly : !c.tcfOnly) s.expert.set[key] = value;
          return;
        }
        if (s.sdk === 'tcf' && CATALOGUE_BY_KEY.has(key)) return;
        {
          const suggestion = suggestKey(key, s.sdk);
          if (suggestion === 'cookiesVersion') return; // never pin a banner the old snippet never pinned
          if (suggestion) return apply(suggestion, value);
          s.expert.custom.push({ key, value: isRaw(value) ? value.$raw : JSON.stringify(value) });
        }
    }
  };
  for (const [key, value] of Object.entries(m)) apply(key, value);

  // Consent Mode: where the defaults live, and who should own them now.
  const settingsEntries = gcmEntriesFromSettings(m.googleConsentMode);
  const inlineDefaults = parsed.gtag.defaults.map((d) => d.entry);
  const earlyGoogle = parsed.google.some((g) => g.kind === 'gtagjs') || parsed.gtag.configs.length > 0;
  if (parsed.google.some((g) => g.kind === 'gtm')) s.google.loading = 'gtm';
  if (parsed.google.some((g) => g.kind === 'gtagjs')) s.google.loading = 'gtagjs';
  else if (parsed.gtag.configs.length) s.google.loading = 'inline';
  if ((settingsEntries && settingsEntries.length) || inlineDefaults.length) {
    s.google.on = true;
    const useInline = inlineDefaults.length > 0 && (earlyGoogle || !(settingsEntries && settingsEntries.length));
    entriesToWizard(useInline ? inlineDefaults : settingsEntries, useInline ? 'inline' : 'settings', s.google);
    s.google.owner = useInline || earlyGoogle ? 'inline' : 'settings';
    const gcm = isObj(m.googleConsentMode) ? m.googleConsentMode : {};
    if (gcm.wait_for_update !== undefined && Number.isFinite(Number(gcm.wait_for_update)) && !useInline) s.google.wait = Number(gcm.wait_for_update);
    s.google.redaction = gcm.ads_data_redaction === true || parsed.gtag.sets.some((x) => x.key === 'ads_data_redaction' && x.value === true);
    s.google.passthrough = gcm.url_passthrough === true || parsed.gtag.sets.some((x) => x.key === 'url_passthrough' && x.value === true);
  }

  if (parsed.crossDomain.length && s.sdk === 'brands') {
    s.crossDomain = true;
    s.crossDomains = uniq(parsed.crossDomain[0].list.map((d) => cleanDomain(d).fixed || d));
  }
  if (parsed.reopen.length) s.link = true;
  if (parsed.preconnect.length) s.preconnect = true;
  if (!s.nonce && parsed.nonces.length) {
    s.csp = true;
    s.nonce = parsed.nonces[0];
  }
  const state = normalizeState(s);
  return { state, parsed, after: (ui) => correctedSnippet(src, parsed, state, ui) };
}

/** The paste with Axeptio's parts replaced by the generated ones, everything else kept in place. */
function correctedSnippet(src, parsed, state, ui) {
  const gen = generate(state, { ui });
  const edits = [];
  const remove = (start, end, replacement = '') => edits.push({ start, end, replacement });
  const owned = new Set();
  for (const l of parsed.loaders) owned.add(l.script);
  for (const a of parsed.assignments) owned.add(a.script);
  for (const p of parsed.props) owned.add(p.script);
  for (const c of parsed.crossDomain) owned.add(c.script);
  for (const sc of parsed.scripts) if (owned.has(sc.index)) remove(sc.start, sc.end);
  // Inline Consent Mode defaults: regenerated, so take them out of the scripts that hold them.
  const gcmCalls = [...parsed.gtag.defaults, ...parsed.gtag.sets.filter((x) => x.key === 'ads_data_redaction' || x.key === 'url_passthrough')];
  const byScript = new Map();
  for (const c of gcmCalls) {
    if (owned.has(c.script)) continue;
    if (!byScript.has(c.script)) byScript.set(c.script, []);
    byScript.get(c.script).push(c);
  }
  for (const [index, calls] of byScript) {
    const sc = parsed.scripts[index];
    let code = sc.code;
    for (const c of [...calls].sort((a, b) => b.start - a.start)) code = code.slice(0, c.start - sc.codeStart) + code.slice(c.end - sc.codeStart);
    const leftover = code
      .replace(/\/\*[\s\S]*?\*\/|\/\/[^\n]*/g, '')
      .replace(/\s+/g, '')
      .replace(/(window\.)?[A-Za-z_$][\w$]*=(window\.)?[A-Za-z_$][\w$]*\|\|\[\];?/g, '')
      .replace(/function gtag\(\)\{[^}]*\}/g, '');
    if (!leftover) remove(sc.start, sc.end);
    else remove(sc.start, sc.end, sc.outer.slice(0, sc.codeStart - sc.start) + code + sc.outer.slice(sc.codeStart - sc.start + sc.code.length));
  }
  if (state.preconnect) for (const p of parsed.preconnect) remove(p.start, p.end);
  const reopenOutside = parsed.reopen.filter((r) => !r.inScript);
  if (gen.footer) for (const r of reopenOutside) remove(r.start, r.end);
  // Where the head blocks go: before the first Google script, or where Axeptio was.
  const anchors = [...edits.map((e) => e.start), ...parsed.google.map((g) => parsed.scripts[g.script].start)];
  const insertAt = anchors.length ? Math.min(...anchors) : 0;
  edits.push({ start: insertAt, end: insertAt, replacement: `${gen.head}\n`, insert: true });
  if (gen.footer) {
    const at = reopenOutside.length ? reopenOutside[0].start : src.length;
    edits.push({ start: at, end: at, replacement: `${at === src.length ? '\n\n' : ''}${gen.footer}\n`, insert: true });
  }
  edits.sort((a, b) => b.start - a.start || (a.insert ? 1 : 0) - (b.insert ? 1 : 0));
  let out = src;
  for (const e of edits) out = out.slice(0, e.start) + e.replacement + out.slice(e.end);
  return out.replace(/\n[ \t]*\n([ \t]*\n)+/g, '\n\n').trim() + '\n';
}

// ---------------------------------------------------------------------------------------------
// Line diff (before / after)
// ---------------------------------------------------------------------------------------------

function diffLines(before, after) {
  const a = str(before).replace(/\r\n?/g, '\n').replace(/\n$/, '').split('\n');
  const b = str(after).replace(/\r\n?/g, '\n').replace(/\n$/, '').split('\n');
  const n = a.length;
  const m = b.length;
  if (n * m > 4_000_000) return [...a.map((text) => ({ type: '-', text })), ...b.map((text) => ({ type: '+', text }))];
  const dp = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = [];
  let i = 0;
  let j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) {
      out.push({ type: ' ', text: a[i] });
      i++;
      j++;
    } else if (dp[i + 1][j] >= dp[i][j + 1]) out.push({ type: '-', text: a[i++] });
    else out.push({ type: '+', text: b[j++] });
  }
  while (i < n) out.push({ type: '-', text: a[i++] });
  while (j < m) out.push({ type: '+', text: b[j++] });
  return out;
}

// ---------------------------------------------------------------------------------------------
// Syntax highlighting by hand (HTML + JS), returns escaped HTML with token spans
// ---------------------------------------------------------------------------------------------

const JS_KEYWORDS = new Set([
  'var', 'let', 'const', 'function', 'return', 'if', 'else', 'for', 'while', 'do', 'new', 'typeof', 'instanceof', 'in', 'of', 'try', 'catch',
  'finally', 'throw', 'true', 'false', 'null', 'undefined', 'this', 'break', 'continue', 'switch', 'case', 'default', 'class', 'async', 'await',
]);

function highlightJs(code) {
  const toks = tokenize(code);
  let out = '';
  let pos = 0;
  toks.forEach((t, i) => {
    out += escapeHtml(code.slice(pos, t.start));
    const text = escapeHtml(code.slice(t.start, t.end));
    let cls = null;
    if (t.type === 'comment') cls = 'c';
    else if (t.type === 'string' || t.type === 'template' || t.type === 'regex') cls = 's';
    else if (t.type === 'number') cls = 'n';
    else if (t.type === 'ident') {
      const next = toks.slice(i + 1).find((x) => x.type !== 'comment');
      const prev = toks.slice(0, i).reverse().find((x) => x.type !== 'comment');
      if (isP(next, ':') && (isP(prev, '{') || isP(prev, ','))) cls = 'p';
      else if (JS_KEYWORDS.has(t.value) && !isP(prev, '.') && !isP(prev, '?.')) cls = 'k';
    }
    out += cls ? `<span class="tk-${cls}">${text}</span>` : text;
    pos = t.end;
  });
  return out + escapeHtml(code.slice(pos));
}

function highlightTag(tag) {
  return tag.replace(/^(<\/?)([\w-]+)([\s\S]*?)(\/?>)$/, (all, open, name, attrs, close) => {
    const a = attrs.replace(/([\w:-]+)(\s*=\s*)("[^"]*"|'[^']*')/g, (x, n, eq, v) => `\u0001a${n}\u0002${eq}\u0001s${v}\u0002`);
    return `\u0001t${open}${name}\u0002${a}\u0001t${close}\u0002`;
  });
}

function highlight(code) {
  const src = str(code);
  let out = '';
  const re = /<\!--[\s\S]*?-->|<script\b[^>]*>[\s\S]*?<\/script\s*>|<\/?[a-zA-Z][^>]*>/g;
  let pos = 0;
  let m;
  const markers = (s) =>
    escapeHtml(s)
      .replace(/\u0001([tas])([\s\S]*?)\u0002/g, (x, c, v) => `<span class="tk-${c}">${v}</span>`);
  while ((m = re.exec(src))) {
    out += escapeHtml(src.slice(pos, m.index));
    const chunk = m[0];
    if (chunk.startsWith('<\!--')) out += `<span class="tk-c">${escapeHtml(chunk)}</span>`;
    else if (/^<script/i.test(chunk)) {
      const open = /^<script\b[^>]*>/i.exec(chunk)[0];
      const close = /<\/script\s*>$/i.exec(chunk)[0];
      out += markers(highlightTag(open)) + highlightJs(chunk.slice(open.length, chunk.length - close.length)) + markers(highlightTag(close));
    } else out += markers(highlightTag(chunk));
    pos = m.index + chunk.length;
  }
  return out + escapeHtml(src.slice(pos));
}

// ---------------------------------------------------------------------------------------------
// URL codec: JSON → deflate-raw → base64url (in the fragment, never the query string)
// ---------------------------------------------------------------------------------------------

function toBase64Url(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function fromBase64Url(text) {
  const b64 = str(text).trim().replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(b64 + '==='.slice((b64.length + 3) % 4));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function pipeBytes(bytes, transform) {
  const stream = new Blob([bytes]).stream().pipeThrough(transform);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function encodeState(state) {
  const json = JSON.stringify(normalizeState(state));
  return toBase64Url(await pipeBytes(new TextEncoder().encode(json), new CompressionStream('deflate-raw')));
}

async function decodeStateInfo(text) {
  const bytes = await pipeBytes(fromBase64Url(text), new DecompressionStream('deflate-raw'));
  const raw = JSON.parse(new TextDecoder().decode(bytes));
  return { state: normalizeState(raw), newer: isObj(raw) && Number(raw.v) > STATE_VERSION };
}

async function decodeState(text) {
  return (await decodeStateInfo(text)).state;
}

// ---------------------------------------------------------------------------------------------
// Tiny DOM builder + morph (keeps focus, caret and scroll while re-rendering)
// ---------------------------------------------------------------------------------------------

const BOOL_PROPS = new Set(['checked', 'disabled', 'selected', 'open', 'hidden', 'readOnly', 'required', 'multiple']);

function h(tag, props, ...children) {
  const el = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v === undefined || v === null || v === false) {
        if (BOOL_PROPS.has(k)) el[k] = false;
        continue;
      }
      if (k === 'class') el.className = Array.isArray(v) ? v.filter(Boolean).join(' ') : v;
      else if (k === 'html') {
        el.innerHTML = v;
        el.__html = v;
      } else if (k === 'value') {
        if (tag === 'select') el.__value = String(v);
        else el.value = String(v);
        if (tag === 'input') el.setAttribute('value', String(v));
      } else if (k === 'key') el.setAttribute('data-key', String(v));
      else if (BOOL_PROPS.has(k)) {
        el[k] = Boolean(v);
        if (v) el.setAttribute(k.toLowerCase(), '');
      } else el.setAttribute(k, v === true ? '' : String(v));
    }
  }
  appendChildren(el, children);
  if (tag === 'select' && el.__value !== undefined) el.value = el.__value;
  return el;
}

function appendChildren(el, children) {
  for (const c of children) {
    if (c === null || c === undefined || c === false) continue;
    if (Array.isArray(c)) appendChildren(el, c);
    else el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  }
}

function morph(from, to) {
  if (from.nodeType !== to.nodeType || from.nodeName !== to.nodeName) {
    from.replaceWith(to);
    return;
  }
  if (from.nodeType === 3 || from.nodeType === 8) {
    if (from.nodeValue !== to.nodeValue) from.nodeValue = to.nodeValue;
    return;
  }
  for (const attr of [...from.attributes]) if (!to.hasAttribute(attr.name)) from.removeAttribute(attr.name);
  for (const attr of [...to.attributes]) if (from.getAttribute(attr.name) !== attr.value) from.setAttribute(attr.name, attr.value);
  const tag = from.nodeName;
  if (tag === 'INPUT') {
    if (from.type === 'checkbox' || from.type === 'radio') {
      if (from.checked !== to.checked) from.checked = to.checked;
    } else if (from.value !== to.value && document.activeElement !== from) from.value = to.value;
    if (from.disabled !== to.disabled) from.disabled = to.disabled;
  } else if (tag === 'TEXTAREA') {
    if (from.value !== to.value && document.activeElement !== from) from.value = to.value;
  } else if (tag === 'DETAILS') {
    if (from.open !== to.open) from.open = to.open;
  } else if (tag === 'BUTTON') {
    if (from.disabled !== to.disabled) from.disabled = to.disabled;
  }
  if (to.__html !== undefined) {
    if (from.__html !== to.__html) {
      from.innerHTML = to.__html;
      from.__html = to.__html;
    }
    return;
  }
  morphChildren(from, to);
  if (tag === 'SELECT' && to.__value !== undefined && from.value !== to.__value) from.value = to.__value;
  if (tag === 'SELECT') from.__value = to.__value;
}

function morphChildren(from, to) {
  const toKids = [...to.childNodes];
  const keyed = new Map();
  for (const k of from.childNodes) {
    const key = k.nodeType === 1 ? k.getAttribute('data-key') : null;
    if (key) keyed.set(key, k);
  }
  for (let j = 0; j < toKids.length; j++) {
    const t = toKids[j];
    const key = t.nodeType === 1 ? t.getAttribute('data-key') : null;
    let match = null;
    if (key) {
      match = keyed.get(key) || null;
      keyed.delete(key);
    } else {
      const cur = from.childNodes[j];
      if (cur && !(cur.nodeType === 1 && cur.getAttribute('data-key'))) match = cur;
    }
    const at = from.childNodes[j] || null;
    if (match) {
      if (match !== at) from.insertBefore(match, at);
      morph(match, t);
    } else {
      from.insertBefore(t, at);
    }
  }
  while (from.childNodes.length > toKids.length) from.lastChild.remove();
}

  const blank = JSON.stringify(SG.normalizeState(state)) === JSON.stringify(SG.defaultState());

    hash = await hashFor({ view: ui.view === 'client' ? 'client' : '', internal: ui.internal ? '1' : '', ui: ui.langFromUrl ? ui.lang : '' });
  }
  const url = `${location.pathname}${location.search}${hash}`;
  if (`${location.pathname}${location.search}${location.hash}` !== url) history.replaceState(null, '', url || location.pathname);
}

function viewLanguages() {
  const m = t();

  const names = configs.map((c) => c.name);
  const other = state.langs.filter((l) => l !== 'fr' && l !== 'en').join(', ');
  const recText = {
    pageProject: decision.pairs ? ml.rec.pageProject(m.list(decision.pairs.slice(0, 2).map(([a, b]) => `${m.q(a)} / ${m.q(b)}`))) : '',

    geoOff: ml.rec.geoOff,
    noOverlap: ml.rec.noOverlap,
    single: ml.rec.single,

  const autoDecision = SG.languageDecision({ ...state, langLogic: 'auto' });
  const langsList = state.langs.length ? state.langs : [];

    'languages',

          hint(ml.htmlHint),
          state.htmlLang !== 'yes' ? alertBox('warning', null, ml.htmlNo) : null,
          radios(ml.logicLabel, 'langLogic', state.langLogic, [['auto', ml.logicAuto], ['page', ml.logicPage], ['browser', ml.logicBrowser]], 'langLogic'),
          note(recText[autoDecision.reason] || ''),

    alertBox(state.pin === 'none' ? 'info' : 'warning', null, ml.pinHint),

function expertValueControl(entry, wizardValue) {

  if (entry.src === 'internal') return h('span', { class: 'muted' }, me.notSet);
  if (entry.key === 'googleConsentMode' || entry.key === 'clientId') {
    return h('span', { class: 'muted' }, me.complex, wizardValue !== undefined && entry.key === 'clientId' ? [' ', code(String(wizardValue))] : null);
  }
  const wizardLabel = wizardValue === undefined ? me.useWizard : `${me.useWizard}: ${typeof wizardValue === 'object' ? JSON.stringify(wizardValue).slice(0, 40) : String(wizardValue)}`;

function setPath(obj, path, value) {
  const parts = path.split('.');
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    const k = /^\d+$/.test(parts[i]) ? Number(parts[i]) : parts[i];
    if (cur[k] === undefined || cur[k] === null) cur[k] = /^\d+$/.test(parts[i + 1]) ? [] : {};
    cur = cur[k];
  }
  cur[/^\d+$/.test(parts[parts.length - 1]) ? Number(parts[parts.length - 1]) : parts[parts.length - 1]] = value;
}

function coerce(el) {
  const type = el.getAttribute('data-type');
  if (el.type === 'checkbox') return el.checked;
  if (type === 'bool') return el.value === 'true';
  if (type === 'number') return el.value === '' ? 0 : Number(el.value);
  if (type === 'lines') return el.value.split(/[\n,;]+/).map((x) => x.trim()).filter(Boolean);
  return el.value;
}

function onBind(el) {
  const path = el.getAttribute('data-bind');
  if (path === 'langs-other') {
    const codes = el.value.split(/[\s,;]+/).map((x) => x.trim().toLowerCase()).filter((x) => /^[a-z]{2,3}$/.test(x) && x !== 'fr' && x !== 'en');
    state.langs = [...state.langs.filter((l) => l === 'fr' || l === 'en'), ...codes];
  } else {
    setPath(state, path, coerce(el));
  }
  if (path === 'sdk') {
    ui.rawText = null;
    if (state.project) state = SG.applyProject(state, state.project, { keepSdk: true });
  }
  commit();
}

function addRegions(entryPath, draftKey) {
  const text = ui.regionDraft[draftKey] || '';
  const codes = text.split(/[\s,;]+/).map((x) => x.trim()).filter(Boolean);
  if (!codes.length) return;
  const entry = entryPath.split('.').reduce((o, k) => o[/^\d+$/.test(k) ? Number(k) : k], state);
  for (const c of codes) {
    const r = SG.checkRegionCode(c);
    const value = r.ok ? r.fixed : r.fixed && ['lowercase', 'spaces', 'territory', 'alias'].includes(r.issue) ? r.fixed : c;
    if (!entry.region.includes(value)) entry.region.push(value);
  }
  ui.regionDraft[draftKey] = '';
  commit();
}

function addVendor() {
  const name = ui.newVendor.name.trim();
  if (!/^[A-Za-z0-9_.-]+$/.test(name)) {
    ui.newVendor.invalid = true;
    scheduleRender();
    return;
  }
  if (!state.vendors.some((v) => v.name === name)) state.vendors.push({ name, title: ui.newVendor.title.trim() || name, on: true, code: '' });
  else state.vendors = state.vendors.map((v) => (v.name === name ? { ...v, on: true } : v));
  ui.newVendor = { name: '', title: '', invalid: false };
  commit();
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    const area = document.createElement('textarea');
    area.value = text;
    area.setAttribute('readonly', '');
    area.style.position = 'fixed';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.select();
    let ok = false;
    try {
      ok = document.execCommand('copy');
    } catch {
      ok = false;
    }
    area.remove();
    return ok;
  }
}

function flashCopied(id, message) {
  ui.copied = id;
  if (message) toast(message);
  scheduleRender();
  clearTimeout(flashCopied.timer);
  flashCopied.timer = setTimeout(() => {
    ui.copied = null;
    scheduleRender();
  }, 1600);
}

function fileStem() {
  const name = (state.project && state.project.name) || state.projectId || 'axeptio';
  const slug = name.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  return `axeptio-snippet-${slug || 'site'}`;
}

function download(filename, text, type) {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function snippetText(out = gen) {
  const m = t();
  return [out.head, out.footer ? `<\!-- ${m.output.footer} -->\n${out.footer}` : ''].filter(Boolean).join('\n\n') + '\n';
}

async function loadProject(rawId) {
  const match = String(rawId || '').match(/[a-f0-9]{24}/i);
  const id = match ? match[0].toLowerCase() : String(rawId || '').trim();
  state.projectId = id;
  if (!/^[a-f0-9]{24}$/.test(id)) {
    commit();
    return;
  }
  ui.load = { status: 'loading', error: null };
  commit();
  const get = async (url) => {
    let res;
    try {
      // No custom headers: anything that triggers a CORS preflight could be refused by the CDN.
      res = await fetch(url);
    } catch {
      throw Object.assign(new Error('network'), { code: 'network' });
    }
    if (res.status === 403 || res.status === 404) return { isEmpty: true };
    if (!res.ok) throw Object.assign(new Error('network'), { code: 'network' });
    try {
      return await res.json();
    } catch {
      throw Object.assign(new Error('invalid'), { code: 'invalid' });
    }
  };
  const [brands, tcf] = await Promise.allSettled([get(SG.urls.brands(id)), get(SG.urls.tcf(id))]);
  if (state.projectId !== id) return; // another load took over
  if (brands.status === 'rejected' && tcf.status === 'rejected') {
    ui.load = { status: 'error', error: brands.reason.code || 'network' };
    commit();
    return;
  }
  const r = SG.projectFromFiles(id, brands.status === 'fulfilled' ? brands.value : null, tcf.status === 'fulfilled' ? tcf.value : null);
  if (r.error) {
    ui.load = { status: 'error', error: brands.status === 'rejected' && r.error === 'notFound' ? brands.reason.code || 'network' : r.error };
  } else {
    state = SG.applyProject(state, r.project);
    ui.load = { status: 'idle', error: null };
    ui.rawText = null;
    rememberProject(id, r.project.name || id);
  }
  commit();
}

const actions = {
  home(el, ev) {
    ev.preventDefault();
    if (ui.view === 'client') ui.view = 'edit';
    window.scrollTo({ top: 0, behavior: 'smooth' });
    commit();
  },
  'ui-lang'(el) {
    ui.lang = el.dataset.arg === 'fr' ? 'fr' : 'en';
    writeStore('ui', ui.lang);
    ui.rawText = null;
    commit();
  },
  theme(el) {
    ui.theme = el.dataset.arg;
    if (ui.theme === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', ui.theme);
    writeStore('theme', ui.theme === 'system' ? null : ui.theme);
    scheduleRender();
  },
  tab(el) {
    ui.tab = el.dataset.arg;
    scheduleRender();
  },
  goto(el, ev) {
    ev.preventDefault();
    const id = el.dataset.arg;
    ui.open[id] = true;
    render();
    const target = document.getElementById(`step-${id}`);
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  },
  recent(el) {
    loadProject(el.dataset.arg);
  },
  'clear-recent'() {
    ui.recent = [];
    writeStore('recent', null);
    scheduleRender();
  },
  unload() {
    state.project = null;
    ui.load = { status: 'idle', error: null };
    commit();
  },
  'lang-toggle'(el) {
    const l = el.dataset.arg;
    state.langs = el.checked ? [...state.langs.filter((x) => x !== l), l].sort((a, b) => ['fr', 'en'].indexOf(a) - ['fr', 'en'].indexOf(b)) : state.langs.filter((x) => x !== l);
    commit();
  },
  preset(el) {
    const kind = el.dataset.arg;
    const codes = kind === 'project' ? SG.suggestOptOutRegions(state.project) : SG.presets[kind] || [];
    for (const c of codes) if (!state.google.optout.region.includes(c)) state.google.optout.region.push(c);
    commit();
  },
  'region-add'(el) {
    const [path, key] = el.dataset.arg.split('|');
    addRegions(path, key);
  },
  'region-remove'(el) {
    const [path, index] = el.dataset.arg.split('|');
    const entry = path.split('.').reduce((o, k) => o[/^\d+$/.test(k) ? Number(k) : k], state);
    entry.region.splice(Number(index), 1);
    commit();
  },
  'entry-add'() {
    state.google.extra.push({ region: [], values: { analytics_storage: 'denied', ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied' } });
    commit();
  },
  'entry-remove'(el) {
    state.google.extra.splice(Number(el.dataset.arg), 1);
    commit();
  },
  'vendor-add'() {
    addVendor();
  },
  'vendor-remove'(el) {
    state.vendors.splice(Number(el.dataset.arg), 1);
    commit();
  },
  pin(el) {
    const key = el.dataset.arg;
    state.expert.pin = el.checked ? [...state.expert.pin, key] : state.expert.pin.filter((k) => k !== key);
    commit();
  },
  expert(el) {
    ui.expert = el.checked;
    ui.rawText = null;
    ui.rawMsg = null;
    scheduleRender();
  },
  'custom-add'() {
    state.expert.custom.push({ key: '', value: '' });
    commit();
  },
  'custom-remove'(el) {
    state.expert.custom.splice(Number(el.dataset.arg), 1);
    commit();
  },
  'raw-apply'() {
    const text = ui.rawText === null ? '' : ui.rawText;
    const parsed = SG.parseLiteral(text);
    if (!parsed.ok || !parsed.value || typeof parsed.value !== 'object' || Array.isArray(parsed.value)) {
      ui.rawMsg = t().expert.rawError;
      scheduleRender();
      return;
    }
    const loader = state.sdk === 'tcf' ? SG.loaders.tcf : SG.loaders.brands;
    const pasted = `<script>\nwindow.axeptioSettings = ${text.replace(/^[\s\S]*?=\s*(?=\{)/, '').replace(/;\s*$/, '')};\n${loader}\n<\/script>`;
    const loaded = SG.fromSnippet(pasted, state);
    const keep = state;
    state = loaded.state;
    // The raw editor only edits axeptioSettings: keep the rest of the answers.
    for (const k of ['google', 'vendors', 'link', 'hideButton', 'preconnect', 'crossDomain', 'crossDomains', 'linkLabels']) {
      if (k === 'google') state.google = { ...keep.google, ...(gcmFrom(loaded.state) || {}) };
      else state[k] = keep[k];
    }
    ui.rawText = null;
    ui.rawMsg = t().expert.rawApplied;
    commit();
  },
  'copy-block'(el) {
    const block = gen.blocks.find((b) => b.id === el.dataset.arg);
    if (block) copyText(block.code).then(() => flashCopied(block.id, t().common.copied));
  },
  'copy-head'() {
    copyText(gen.head + '\n').then(() => flashCopied('head', t().common.copied));
  },
  async 'copy-link'() {
    const url = `${location.origin}${location.pathname}${await hashFor()}`;
    copyText(url).then(() => flashCopied('link', t().toolbar.linkCopied));
  },
  share() {
    ui.share = !ui.share;
    scheduleRender();
  },
  async 'copy-client-link'() {
    const url = `${location.origin}${location.pathname}${await hashFor({ view: 'client', ui: ui.lang })}`;
    copyText(url).then(() => flashCopied('client', t().share.copied));
  },
  'download-html'() {
    download(`${fileStem()}.html`, guideHtml(), 'text/html;charset=utf-8');
  },
  'download-txt'() {
    download(`${fileStem()}.txt`, snippetText(), 'text/plain;charset=utf-8');
  },
  'download-domain'(el) {
    const d = gen.guide.crossDomain && gen.guide.crossDomain.perDomain ? gen.guide.crossDomain.perDomain.find((x) => x.domain === el.dataset.arg) : null;
    if (d) download(`axeptio-snippet-${d.domain.replace(/[^a-z0-9]+/gi, '-')}.txt`, `${d.code}\n`, 'text/plain;charset=utf-8');
  },
  'audit-load'() {
    const loaded = SG.fromSnippet(ui.auditText, state);
    state = loaded.state;
    ui.auditBefore = ui.auditText;
    ui.auditAfter = loaded.after(ui.lang);
    ui.rawText = null;
    commit();
  },
  edit() {
    ui.view = 'edit';
    commit();
  },
};

function gcmFrom(s) {
  return s.google && s.google.on && s.google.owner === 'settings' ? s.google : null;
}

function onClick(ev) {
  const el = ev.target.closest('[data-act]');
  if (!el || el.tagName === 'FORM') return;
  if (el.tagName === 'INPUT' && el.type === 'checkbox' && ev.type === 'click') return; // handled on change
  const fn = actions[el.dataset.act];
  if (fn) fn(el, ev);
}

function onChange(ev) {
  const el = ev.target;
  if (el.matches('input[type="checkbox"][data-act]')) {
    const fn = actions[el.dataset.act];
    if (fn) fn(el, ev);
    return;
  }
  if (el.hasAttribute('data-expert')) {
    const key = el.getAttribute('data-expert');
    const type = el.getAttribute('data-expert-type');
    const raw = el.value.trim();
    if (raw === '') delete state.expert.set[key];
    else if (type === 'json') state.expert.set[key] = JSON.parse(raw);
    else if (type === 'duration') state.expert.set[key] = /^\d+$/.test(raw) ? Number(raw) : raw;
    else if (type === 'literal') {
      const parsed = SG.parseLiteral(raw);
      state.expert.set[key] = parsed.ok ? parsed.value : { $raw: raw };
    } else state.expert.set[key] = raw;
    commit();
    return;
  }
  if (el.hasAttribute('data-bind') && (el.type === 'radio' || el.type === 'checkbox' || el.tagName === 'SELECT' || el.getAttribute('data-bind') === 'langs-other')) onBind(el);
  if (el.getAttribute('data-normalize') === 'projectId') {
    const match = el.value.match(/[a-f0-9]{24}/i);
    if (match && match[0].toLowerCase() !== state.projectId) {
      state.projectId = match[0].toLowerCase();
      commit();
    }
  }
}

function onInput(ev) {
  const el = ev.target;
  if (ev.isComposing) return;
  if (el.hasAttribute('data-draft')) {
    const key = el.getAttribute('data-draft');
    if (key === 'vendorName') ui.newVendor.name = el.value;
    else if (key === 'vendorTitle') ui.newVendor.title = el.value;
    else ui.regionDraft[key] = el.value;
    if (key === 'vendorName') ui.newVendor.invalid = false;
    return;
  }
  if (el.hasAttribute('data-audit')) {
    ui.auditText = el.value;
    ui.auditAfter = null;
    scheduleRender();
    return;
  }
  if (el.hasAttribute('data-raw')) {
    ui.rawText = el.value;
    ui.rawMsg = null;
    return;
  }
  if (el.getAttribute('data-act-input') === 'pin-case') {
    const lang = el.dataset.arg;
    const rest = state.pinCases.filter((c) => c.lang !== lang);
    state.pinCases = el.value.trim() ? [...rest, { lang, config: el.value }] : rest;
    commit();
    return;
  }
  if (el.hasAttribute('data-bind') && el.type !== 'radio' && el.type !== 'checkbox' && el.tagName !== 'SELECT' && el.getAttribute('data-bind') !== 'langs-other') onBind(el);
}

function onKeydown(ev) {
  const el = ev.target;
  if (ev.key === 'Enter' && el.hasAttribute('data-enter')) {
    ev.preventDefault();
    const act = el.getAttribute('data-enter');
    if (act === 'region-add') {
      const [path, key] = el.dataset.arg.split('|');
      ui.regionDraft[key] = el.value;
      addRegions(path, key);
    } else if (act === 'vendor-add') {
      addVendor();
    }
  }
}

function onSubmit(ev) {
  ev.preventDefault();
  if (ev.target.getAttribute('data-act') === 'load-form') {
    const input = ev.target.querySelector('#project-id');
    loadProject(input ? input.value : state.projectId);
  }
}

function onToggle(ev) {
  const el = ev.target;
  if (el.tagName === 'DETAILS' && el.dataset.step) ui.open[el.dataset.step] = el.open;
}

async function readHash() {
  const params = new URLSearchParams(location.hash.slice(1));
  ui.notice = null;
  if (params.get('s')) {
    try {
      const info = await SG.decodeStateInfo(params.get('s'));
      state = info.state;
      if (info.newer) ui.notice = 'newer';
    } catch {
      state = SG.defaultState();
      ui.notice = 'damaged';
    }
  }
  ui.view = params.get('view') === 'client' ? 'client' : 'edit';
  ui.internal = params.get('internal') === '1' || params.get('internal') === 'true';
  const lang = params.get('ui');
  if (lang === 'fr' || lang === 'en') {
    ui.lang = lang;
    ui.langFromUrl = true;
  }
}

async function start() {
  const stored = readStore('ui');
  ui.lang = stored === 'fr' || stored === 'en' ? stored : detectLang();
  const theme = readStore('theme');
  ui.theme = theme === 'light' || theme === 'dark' ? theme : 'system';
  ui.recent = readRecent();
  await readHash();
  const app = document.getElementById('app');
  app.addEventListener('click', onClick);
  app.addEventListener('change', onChange);
  app.addEventListener('input', onInput);
  app.addEventListener('keydown', onKeydown);
  app.addEventListener('submit', onSubmit);
  app.addEventListener('toggle', onToggle, true);
  window.addEventListener('hashchange', async () => {
    const current = await hashFor({ view: ui.view === 'client' ? 'client' : '', internal: ui.internal ? '1' : '', ui: ui.langFromUrl ? ui.lang : '' });
    if (location.hash && location.hash !== current) {
      await readHash();
      render();
    }
  });
  render();
  document.documentElement.setAttribute('data-ready', '1');
}

start();
})();
</script>
</body>
